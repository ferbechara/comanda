:root {
  --bg-dark: #0a0e17;
  --panel-bg: rgba(20, 27, 41, 0.85);
  --panel-border: #1e293b;

  --primary: #10b981;

  --accent-gold: #f59e0b;

  --fg-sub: #94a3b8;
  --danger: #ef4444;
  --warning: #f59e0b;
  --success: #10b981;
  --row-even: #121926;
  --me-bg: rgba(245, 158, 11, 0.15);
  --me-border: #f59e0b;
}

*{box-sizing:border-box}
body {
  margin: 0;
  color: var(--fg);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #070a10 linear-gradient(135deg, #070a10 0%, #0f172a 50%, #061121 100%);
  background-attachment: fixed;
  min-height: 100vh;
}

.w { max-width: 860px; margin: 0 auto; padding: 15px 12px 70px; }

.menu-header-img {
  width: 100%;
  height: 100px;
  border-radius: 8px 8px 0 0;
  background-size: cover;
  background-position: center;
  position: relative;
  display: flex;
  align-items: flex-end;
  padding: 12px;
}
.menu-header-img::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(20,27,41,1) 0%, rgba(20,27,41,0.2) 100%);
}
.menu-header-title {
  position: relative;
  z-index: 2;
  font-size: 20px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  display: flex;
  align-items: center;
  gap: 8px;
}

.bg-home { background: radial-gradient(circle, #10b981 0%, #064e3b 100%); }
.bg-tactics { background: linear-gradient(45deg, #0284c7, #0f172a); }
.bg-squad { background: linear-gradient(45deg, #3b82f6, #1e1b4b); }
.bg-cup { background: linear-gradient(45deg, #d97706, #451a03); }
.bg-market { background: linear-gradient(45deg, #8b5cf6, #2e1065); }

.win {
  background: var(--panel-bg);
  backdrop-filter: blur(12px);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  margin-bottom: 16px;
  overflow: hidden;
}

.tb {
  background: rgba(30, 41, 59, 0.8);
  color: var(--fg);
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--panel-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.bd { padding: 14px; overflow-x: auto; }

.lk { color: var(--accent); font-weight: 600; text-decoration: none; cursor: pointer; }
.lk:hover { text-decoration: underline; }

select, input {
  font: inherit;
  color: var(--fg);
  background: var(--card-bg);
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  padding: 6px 10px;
  outline: none;
}
select:focus, input:focus { border-color: var(--primary); }

.nav-main {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
  margin-bottom: 16px;
}

.nav-sub {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--panel-border);
  padding-bottom: 8px;
}

button {
  font: inherit;
  color: var(--fg);
  background: #1e293b;
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  padding: 6px 14px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
button:hover:not(:disabled) {
  background: #334155;
  border-color: var(--fg-sub);
  transform: translateY(-1px);
}
button:active:not(:disabled) { transform: translateY(0); }
button.on {
  background: var(--primary);
  color: #000;
  border-color: var(--primary);
  box-shadow: 0 0 12px var(--primary-glow);
}
button.big {
  font-size: 15px;
  font-weight: 700;
  padding: 10px 20px;
  background: linear-gradient(135deg, var(--primary), #059669);
  color: #000;
  border: none;
  box-shadow: 0 4px 14px var(--primary-glow);
}
button.secondary-big {
  font-size: 15px;
  font-weight: 700;
  padding: 10px 20px;
  background: linear-gradient(135deg, var(--accent), #2563eb);
  color: #fff;
  border: none;
}

.btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 8px; overflow: hidden; }
th, td { padding: 8px 10px; text-align: left; font-size: 13px; }
th { background: #0f172a; color: var(--fg-sub); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
tr:nth-child(even) td { background: var(--row-even); }
tr.me td { background: var(--me-bg) !important; font-weight: 700; color: #fff; }
tr.me { border-left: 3px solid var(--me-border); }

.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #334155;
  vertical-align: middle;
  margin-right: 8px;
  border: 1px solid rgba(255,255,255,0.2);
  display: inline-block;
}

.player-cell { display: flex; align-items: center; }

.sc { overflow-x: auto; }
.m { color: var(--danger); font-weight: 700; }
.sm { font-size: 12px; color: var(--fg-sub); }
.nat { display: inline-block; padding: 2px; border-radius: 4px; border: 1px solid transparent; line-height: 0; }
.nat.ext { border-color: var(--warning); box-shadow: 0 0 0 1px rgba(245,158,11,.35); }

.task {
  position: fixed; left: 0; right: 0; bottom: 0; height: 40px;
  background: #0f172a; border-top: 1px solid var(--panel-border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px; z-index: 100; font-size: 12px;
}

.badge {
  padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase;
}
.badge-por { background: #d97706; color: #fff; }
.badge-def { background: #2563eb; color: #fff; }
.badge-med { background: #059669; color: #fff; }
.badge-del { background: #dc2626; color: #fff; }
.badge-juv { background: #7c3aed; color: #fff; }

.eco-card {
  background: linear-gradient(135deg, rgba(16,185,129,0.1), rgba(15,23,42,0.6));
  border: 1px solid var(--primary);
  border-radius: 8px; padding: 12px; margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.bg-fin { background: linear-gradient(45deg, #f59e0b, #451a03); }
.match-banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:0 0 8px 8px;margin:-4px 0 12px;border:1px solid rgba(255,255,255,.12);color:#fff}
.match-banner .mb-ic{font-size:32px;line-height:1}
.match-banner .mb-t{font-size:18px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.match-banner .mb-d{font-size:13px;opacity:.92;margin-top:2px}
.mb-liga{background:linear-gradient(90deg,#1d4ed8,#1e293b)}
.mb-copa{background:linear-gradient(90deg,#b45309,#451a03)}
.mb-cont{background:linear-gradient(90deg,#047857,#022c22)}
.mb-intc{background:linear-gradient(90deg,#7c3aed,#1e1b4b)}
.mb-sup{background:linear-gradient(90deg,#be123c,#4c0519)}
.mb-libre{background:linear-gradient(90deg,#475569,#1e293b)}
.cal-t tr.maybe td{opacity:.65;font-style:italic}
/* Noticias: tipografía +30% (de 12px a 15,6px) */
.sm.news, .news { font-size: 15.6px; line-height: 1.5; }
.fin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 10px; }
.fin-kpi { background: var(--card-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 2px; }

.fin-bars { display: flex; align-items: flex-end; gap: 3px; height: 52px; padding: 4px 0; border-bottom: 1px solid var(--panel-border); }
.fin-bar { flex: 1; min-width: 5px; border-radius: 2px 2px 0 0; }
.fin-opt { background: var(--card-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }

ton>","<p class=\"sm\">Aprobación media de los clubes: <b>":"<p class=\"sm\">Average club approval: <b>","<p class=\"sm\">Cada entrenador puede trabajar con varios jugadores de su línea a la vez según su calidad: 1 (calidad menor a 52), 2 (52 a 64), 3 (65 a 79) o 4 (80 o más). Cada jugador elegido tiene su propia chance de mejorar en cada jornada.</p>":"<p class=\"sm\">Each coach can work with several players from his line at once depending on his quality: 1 (quality below 52), 2 (52 to 64), 3 (65 to 79) or 4 (80 or more). Each chosen player has his own chance of improving every matchday.</p>","<p class=\"sm\">Contrato fijo, sin bono.</p>":"<p class=\"sm\">Fixed contract, no bonus.</p>","<p class=\"sm\">Cupo de extranjeros: <b>":"<p class=\"sm\">Foreign players: <b>","<p class=\"sm\">Definición por penales: ganó <b>":"<p class=\"sm\">Penalty shoot-out: won by <b>","<p class=\"sm\">Durante las jornadas 15 y 16 podés renunciar a la presidencia y volver al modo manager con tres ofertas.</p><button onclick=\"presDecline()\">Renunciar al cargo</button>":"<p class=\"sm\">During matchdays 15 and 16 you can resign the presidency and return to manager mode with three offers.</p><button onclick=\"presDecline()\">Resign</button>","<p class=\"sm\">El contrato dura toda la temporada (":"<p class=\"sm\">The contract runs for the whole season (","<p class=\"sm\">El contrato dura toda la temporada. Al empezar la siguiente elegís de nuevo.</p>":"<p class=\"sm\">The contract runs for the whole season. At the start of the next one you choose again.</p>","<p class=\"sm\">Eliminación directa con los ":"<p class=\"sm\">Straight knockout with the ","<p class=\"sm\">Cada mediocampista defensivo (MCD) aporta un 75% a la defensa y un 25% al ataque; cada ofensivo (MCO), un 75% al ataque y un 25% a la defensa. En las formaciones de 4 líneas (4-2-3-1 y 4-1-3-2) además hay puestos específicos para cada tipo. En tu plantel: <b>":"<p class=\"sm\">Each defensive midfielder (DM) contributes 75% to defence and 25% to attack; each attacking midfielder (AM), 75% to attack and 25% to defence. In 4-line formations (4-2-3-1 and 4-1-3-2) there are also specific positions for each type. In your squad: <b>","<p class=\"sm\">Esta temporada no hay Copa Nacional (empieza con la próxima).</p>":"<p class=\"sm\">There's no National Cup this season (it starts next season).</p>","<p class=\"sm\">Esta temporada no se disputa (empieza con la próxima).</p>":"<p class=\"sm\">Not played this season (starts next season).</p>","<p class=\"sm\">Esta temporada no se disputa la Copa Intercontinental.</p>":"<p class=\"sm\">The Intercontinental Cup isn't played this season.</p>","<p class=\"sm\">Estos jugadores terminan su contrato al final de la temporada: si no renuevan, se van libres. Cada uno decide según los minutos que juega, si se siente por encima del club y la duración que le ofrecés (los veteranos prefieren contratos largos; los jóvenes que se creen mejores que su club, cortos).</p><div class=\"sc\"><table><tr><th>Pos</th><th>Jugador</th><th>Edad</th><th>Nivel</th><th>Minutos</th><th>Disposición</th><th>Renovar por</th><th></th></tr>":"<p class=\"sm\">These players' contracts end at the end of the season: if they don't renew, they leave on a free. Each one decides based on the minutes he plays, whether he feels above the club, and the length you offer (veterans prefer long contracts; young players who think they're better than their club, short ones).</p><div class=\"sc\"><table><tr><th>Pos</th><th>Player</th><th>Age</th><th>Level</th><th>Minutes</th><th>Willingness</th><th>Renew for</th><th></th></tr>","<p class=\"sm\">Fabricás los productos pagando su costo por unidad, les ponés tu precio de venta y las ventas se producen en cada jornada de liga mientras haya stock. Un precio alto da más margen pero vende menos; uno bajo vende más con menos margen. Una mejor posición en la liga y una hinchada más grande venden más.</p>":"<p class=\"sm\">You make products paying their unit cost, set your own selling price, and sales happen on every league matchday while there's stock. A high price gives more margin but sells less; a low one sells more with less margin. A better league position and a bigger fan base sell more.</p>","<p class=\"sm\">Fondo de solidaridad automático: cada jornada, los clubes en situación <b style=\"color:#ef4444\">Mala</b> reciben una cuota.</p><div class=\"btn-group\">":"<p class=\"sm\">Automatic solidarity fund: every matchday, clubs in a <b style=\"color:#ef4444\">Poor</b> situation receive a payment.</p><div class=\"btn-group\">","<p class=\"sm\">Intensivo (":"<p class=\"sm\">Intensive (","<p class=\"sm\">Juegan los campeones de la Copa Internacional (Sudamérica) y de la Copa Europea, más un representante de cada otro continente, que cambian cada temporada. Cuartos: África, Asia, Oceanía y Centro/Norteamérica. Semifinales: se suman los campeones de Europa y Sudamérica. Si tu club participa: +3 M por jugar la semifinal, +4 M por llegar a la final, +10 M si sos campeón (+2 M si perdés la final).</p><table><tr><th>Continente</th><th>Representante de esta temporada</th></tr>":"<p class=\"sm\">The champions of the International Cup (South America) and the European Cup play, plus one representative from each other continent, which change every season. Quarter-finals: Africa, Asia, Oceania and Central/North America. Semi-finals: the champions of Europe and South America join. If your club takes part: +3 M for playing the semi-final, +4 M for reaching the final, +10 M if you're champion (+2 M if you lose the final).</p><table><tr><th>Continent</th><th>This season's representative</th></tr>","<p class=\"sm\">Jóvenes promesas en formación. Nuevo juvenil cada ":"<p class=\"sm\">Young prospects in development. New youth player every ","<p class=\"sm\">La aprobación de cada club se actualiza <b>todas las jornadas</b> y tiende hacia un valor que depende de: (1) cuánto recibe respecto de lo esperado para su categoría, (2) su salud económica (Malo −6, Riesgoso −2, Saludable +1, Excelente +3), (3) los asuntos que resolvés (ayudas, reclamos, sedes, giras), (4) objetivos de la selección, (5) premios de Copa, streaming exclusivo (pequeños −5), caja en rojo y cuotas impagas. Cada decisión puntual mueve la aprobación al instante a la mitad de su efecto y el resto llega de a poco.</p>":"<p class=\"sm\">Each club's approval is updated <b>every matchday</b> and tends towards a value that depends on: (1) how much it gets compared with what's expected for its category, (2) its financial health (Poor −6, Risky −2, Healthy +1, Excellent +3), (3) the issues you resolve (aid, complaints, hosting, tours), (4) national team goals, (5) Cup prizes, exclusive streaming (small clubs −5), cash in the red and unpaid fees. Each one-off decision moves approval instantly by half its effect and the rest arrives gradually.</p>","<p class=\"sm\">La calidad (40 a 88) funciona igual que la de los entrenadores: <b>80 o más</b> entrega en 1 jornada · <b>65 a 79</b> en 2 · <b>52 a 64</b> en 3 · <b>menos de 52</b> en 4. Y encuentra de 2 jugadores (calidad 40) a 8 (calidad 88).</p>":"<p class=\"sm\">Quality (40 to 88) works the same as for coaches: <b>80 or more</b> delivers in 1 matchday · <b>65 to 79</b> in 2 · <b>52 to 64</b> in 3 · <b>below 52</b> in 4. And finds from 2 players (quality 40) to 8 (quality 88).</p>","<p class=\"sm\">La liga sigue en segundo plano. Tu club (":"<p class=\"sm\">The league continues in the background. Your club (","<p class=\"sm\">La selección juega las eliminatorias en el estadio sede: cuanto mejor es, más taquilla y más alquiler cobra el club. Para que más clubes puedan ser sede, subsidiá obras (la Asociación paga la mitad, el club la otra mitad) y ganás aprobación. El <b>Plan de estadios</b> lo hace solo cada 5 jornadas con hasta 2 clubes (los más ricos con estadio mejorable).</p><div class=\"btn-group\">":"<p class=\"sm\">The national team plays qualifiers at the host stadium: the better it is, the more ticket income and the more rent the club earns. So that more clubs can host, subsidise works (the Association pays half, the club the other half) and you gain approval. The <b>Stadium plan</b> does it automatically every 5 matchdays with up to 2 clubs (the richest ones with an upgradable stadium).</p><div class=\"btn-group\">","<p class=\"sm\">Los compromisos condicionales dependen de que avances de ronda o clasifiques. Importancia: Máxima (semifinales, finales e Intercontinental) · Alta (eliminación directa) · Media (liga y Supercopa).</p>":"<p class=\"sm\">Conditional fixtures depend on you advancing or qualifying. Importance: Maximum (semi-finals, finals and Intercontinental) · High (knockouts) · Medium (league and Super Cup).</p>","<p class=\"sm\">Los premios a los clubes por ronda ganada y por la Supercopa los paga la Asociación. Ingresás derechos y taquilla por cada ronda (más en semifinales y final). Una política generosa cuesta más pero mejora la aprobación; una austera la reduce.</p><div class=\"btn-group\">":"<p class=\"sm\">The Association pays the clubs' prizes per round won and for the Super Cup. You collect rights and ticket income for each round (more in the semi-finals and final). A generous policy costs more but improves approval; an austere one lowers it.</p><div class=\"btn-group\">","<p class=\"sm\">Mandato: te queda una temporada más.</p><button class=\"big\" onclick=\"presCont()\">Continuar como Presidente</button> <button onclick=\"presDecline()\">Renunciar al cargo (volver a dirigir)</button>":"<p class=\"sm\">Term: you have one more season left.</p><button class=\"big\" onclick=\"presCont()\">Continue as President</button> <button onclick=\"presDecline()\">Resign (return to managing)</button>","<p class=\"sm\">Nivel actual: <b>":"<p class=\"sm\">Current level: <b>","<p class=\"sm\">Nivel máximo.</p>":"<p class=\"sm\">Maximum level.</p>","<p class=\"sm\">No tenés suplentes disponibles de ":"<p class=\"sm\">You have no substitutes available for ","<p class=\"sm\">No tenés suplentes disponibles en esa línea: el lugar lo ocupa un jugador de otra posición, con penalización.</p>":"<p class=\"sm\">You have no substitutes available in that line: the spot is taken by a player from another position, with a penalty.</p>","<p class=\"sm\">Ofertá por jugadores visitando la sección Clubes.</p>":"<p class=\"sm\">Make offers for players by visiting the Clubs section.</p>","<p class=\"sm\">Para clubes, el precio es el que suele pedir el club (valor del jugador +10%). Para agentes libres, es el precio con descuento. Los jugadores libres del informe son inventados, como los del mercado libre.</p>":"<p class=\"sm\">For clubs, the price is what the club usually asks (player value +10%). For free agents, it's the discounted price. Free agents in the report are made up, like those in the free market.</p>","<p class=\"sm\">Por defecto jugás el segundo tiempo con <b>":"<p class=\"sm\">By default you play the second half with <b>","<p class=\"sm\">Próximo Campeonato Mundial: temporada <b>":"<p class=\"sm\">Next World Championship: season <b>","<p class=\"sm\">Recibe el plantel actual del club con 20 M de presupuesto, semillero y estadio básicos y sin sponsor ni cuerpo técnico. Juega en el último turno de cada jornada. Los clubes que ya dirige un manager no se pueden elegir.</p>":"<p class=\"sm\">Takes over the club's current squad with a 20 M budget, a basic academy and stadium, and no sponsor or staff. Plays in the last turn of each matchday. Clubs already run by a manager can't be chosen.</p>","<p class=\"sm\">Se juega al cerrar la temporada entre el campeón de Liga y el campeón de Copa (si es el mismo, enfrenta al subcampeón de Liga). Premio: 3 M al ganador y 1 M al perdedor.</p>":"<p class=\"sm\">Played at the end of the season between the League champion and the Cup champion (if it's the same club, it faces the League runner-up). Prize: 3 M to the winner and 1 M to the loser.</p>","<p class=\"sm\">Se juegan en las jornadas ":"<p class=\"sm\">Played on matchdays ","<p class=\"sm\">Se pagan solo si se cumple el objetivo. Motivan al plantel (más nivel en el torneo).</p><div class=\"btn-group\">":"<p class=\"sm\">Only paid if the goal is met. They motivate the squad (higher level in the tournament).</p><div class=\"btn-group\">","<p class=\"sm\">Siguen en carrera ":"<p class=\"sm\">Still in it ","<p class=\"sm\">Sin datos.</p>":"<p class=\"sm\">No data.</p>","<p class=\"sm\">Sin goles por ahora.</p>":"<p class=\"sm\">No goals yet.</p>","<p class=\"sm\">Sin ofertas por el momento.</p>":"<p class=\"sm\">No offers at the moment.</p>","<p class=\"sm\">Sin transferencias recientes.</p>":"<p class=\"sm\">No recent transfers.</p>","<p class=\"sm\">Tenés que resolver este asunto antes de avanzar la jornada.</p>":"<p class=\"sm\">You have to resolve this issue before advancing the matchday.</p>","<p class=\"sm\">Todavía no hay informes. Cuando tu ojeador termine una búsqueda, el resultado aparece acá.</p>":"<p class=\"sm\">No reports yet. When your scout finishes a search, the result appears here.</p>","<p class=\"sm\">Todavía no se jugó esta temporada.</p>":"<p class=\"sm\">Not played yet this season.</p>","<p class=\"sm\">Torneo de esta temporada: <b>":"<p class=\"sm\">This season's tournament: <b>","<p class=\"sm\">Tu club no compite en esta jornada.</p><button class=\"big\" onclick=\"endTurn()\">Pasar la jornada ▶</button>":"<p class=\"sm\">Your club isn't playing this matchday.</p><button class=\"big\" onclick=\"endTurn()\">Skip matchday ▶</button>","<p class=\"sm\">Tu partido contra ":"<p class=\"sm\">Your match against ","<p class=\"sm\">Tu tienda está en el nivel máximo.</p>":"<p class=\"sm\">Your shop is at the maximum level.</p>","<p class=\"sm\">⭐ Los clubes de Primera de ":"<p class=\"sm\">⭐ The First Division clubs of ","<p class=\"sm\">🏆 clasifica a la ":"<p class=\"sm\">🏆 qualifies for the ","<p class=\"sm\">📩 Pedidos de managers: no hay pedidos pendientes.</p>":"<p class=\"s 2-3-1 e 4-1-3-2) também há posições específicas para cada tipo. No seu elenco: <b>","<p class=\"sm\">Esta temporada no hay Copa Nacional (empieza con la próxima).</p>":"<p class=\"sm\">Nesta temporada não há Copa Nacional (começa na próxima).</p>","<p class=\"sm\">Esta temporada no se disputa (empieza con la próxima).</p>":"<p class=\"sm\">Não é disputada nesta temporada (começa na próxima).</p>","<p class=\"sm\">Esta temporada no se disputa la Copa Intercontinental.</p>":"<p class=\"sm\">A Copa Intercontinental não é disputada nesta temporada.</p>","<p class=\"sm\">Estos jugadores terminan su contrato al final de la temporada: si no renuevan, se van libres. Cada uno decide según los minutos que juega, si se siente por encima del club y la duración que le ofrecés (los veteranos prefieren contratos largos; los jóvenes que se creen mejores que su club, cortos).</p><div class=\"sc\"><table><tr><th>Pos</th><th>Jugador</th><th>Edad</th><th>Nivel</th><th>Minutos</th><th>Disposición</th><th>Renovar por</th><th></th></tr>":"<p class=\"sm\">Estes jogadores terminam o contrato no fim da temporada: se não renovarem, saem livres. Cada um decide segundo os minutos que joga, se se sente acima do clube e a duração que você oferece (os veteranos preferem contratos longos; os jovens que se acham melhores que o clube, curtos).</p><div class=\"sc\"><table><tr><th>Pos</th><th>Jogador</th><th>Idade</th><th>Nível</th><th>Minutos</th><th>Disposição</th><th>Renovar por</th><th></th></tr>","<p class=\"sm\">Fabricás los productos pagando su costo por unidad, les ponés tu precio de venta y las ventas se producen en cada jornada de liga mientras haya stock. Un precio alto da más margen pero vende menos; uno bajo vende más con menos margen. Una mejor posición en la liga y una hinchada más grande venden más.</p>":"<p class=\"sm\">Você fabrica os produtos pagando o custo por unidade, define seu preço de venda e as vendas acontecem em cada rodada da liga enquanto houver estoque. Um preço alto dá mais margem, mas vende menos; um baixo vende mais com menos margem. Uma posição melhor na liga e uma torcida maior vendem mais.</p>","<p class=\"sm\">Fondo de solidaridad automático: cada jornada, los clubes en situación <b style=\"color:#ef4444\">Mala</b> reciben una cuota.</p><div class=\"btn-group\">":"<p class=\"sm\">Fundo de solidariedade automático: a cada rodada, os clubes em situação <b style=\"color:#ef4444\">Ruim</b> recebem uma cota.</p><div class=\"btn-group\">","<p class=\"sm\">Juegan los campeones de la Copa Internacional (Sudamérica) y de la Copa Europea, más un representante de cada otro continente, que cambian cada temporada. Cuartos: África, Asia, Oceanía y Centro/Norteamérica. Semifinales: se suman los campeones de Europa y Sudamérica. Si tu club participa: +3 M por jugar la semifinal, +4 M por llegar a la final, +10 M si sos campeón (+2 M si perdés la final).</p><table><tr><th>Continente</th><th>Representante de esta temporada</th></tr>":"<p class=\"sm\">Jogam os campeões da Copa Internacional (América do Sul) e da Copa Europeia, mais um representante de cada outro continente, que mudam a cada temporada. Quartas: África, Ásia, Oceania e América Central/do Norte. Semifinais: entram os campeões da Europa e da América do Sul. Se seu clube participar: +3 M por jogar a semifinal, +4 M por chegar à final, +10 M se for campeão (+2 M se perder a final).</p><table><tr><th>Continente</th><th>Representante desta temporada</th></tr>","<p class=\"sm\">Jóvenes promesas en formación. Nuevo juvenil cada ":"<p class=\"sm\">Jovens promessas em formação. Novo jogador da base a cada ","<p class=\"sm\">La aprobación de cada club se actualiza <b>todas las jornadas</b> y tiende hacia un valor que depende de: (1) cuánto recibe respecto de lo esperado para su categoría, (2) su salud económica (Malo −6, Riesgoso −2, Saludable +1, Excelente +3), (3) los asuntos que resolvés (ayudas, reclamos, sedes, giras), (4) objetivos de la selección, (5) premios de Copa, streaming exclusivo (pequeños −5), caja en rojo y cuotas impagas. Cada decisión puntual mueve la aprobación al instante a la mitad de su efecto y el resto llega de a poco.</p>":"<p class=\"sm\">A aprovação de cada clube é atualizada <b>a cada rodada</b> e tende a um valor que depende de: (1) quanto recebe em relação ao esperado para sua categoria, (2) sua saúde financeira (Ruim −6, Arriscada −2, Saudável +1, Excelente +3), (3) os assuntos que você resolve (ajudas, reclamações, sedes, excursões), (4) objetivos da seleção, (5) prêmios de Copa, streaming exclusivo (pequenos −5), caixa no vermelho e cotas não pagas. Cada decisão pontual move a aprovação na hora pela metade do efeito e o resto chega aos poucos.</p>","<p class=\"sm\">La calidad (40 a 88) funciona igual que la de los entrenadores: <b>80 o más</b> entrega en 1 jornada · <b>65 a 79</b> en 2 · <b>52 a 64</b> en 3 · <b>menos de 52</b> en 4. Y encuentra de 2 jugadores (calidad 40) a 8 (calidad 88).</p>":"<p class=\"sm\">A qualidade (40 a 88) funciona igual à dos treinadores: <b>80 ou mais</b> entrega em 1 rodada · <b>65 a 79</b> em 2 · <b>52 a 64</b> em 3 · <b>menos de 52</b> em 4. E encontra de 2 jogadores (qualidade 40) a 8 (qualidade 88).</p>","<p class=\"sm\">La liga sigue en segundo plano. Tu club (":"<p class=\"sm\">A liga continua em segundo plano. Seu clube (","<p class=\"sm\">La selección juega las eliminatorias en el estadio sede: cuanto mejor es, más taquilla y más alquiler cobra el club. Para que más clubes puedan ser sede, subsidiá obras (la Asociación paga la mitad, el club la otra mitad) y ganás aprobación. El <b>Plan de estadios</b> lo hace solo cada 5 jornadas con hasta 2 clubes (los más ricos con estadio mejorable).</p><div class=\"btn-group\">":"<p class=\"sm\">A seleção joga as eliminatórias no estádio-sede: quanto melhor ele for, mais bilheteria e mais aluguel o clube recebe. Para que mais clubes possam ser sede, subsidie obras (a Federação paga metade, o clube a outra metade) e você ganha aprovação. O <b>Plano de estádios</b> faz isso sozinho a cada 5 rodadas com até 2 clubes (os mais ricos com estádio ampliável).</p><div class=\"btn-group\">","<p class=\"sm\">Los compromisos condicionales dependen de que avances de ronda o clasifiques. Importancia: Máxima (semifinales, finales e Intercontinental) · Alta (eliminación directa) · Media (liga y Supercopa).</p>":"<p class=\"sm\">Os compromissos condicionais dependem de você avançar de fase ou se classificar. Importância: Máxima (semifinais, finais e Intercontinental) · Alta (mata-mata) · Média (liga e Supercopa).</p>","<p class=\"sm\">Los premios a los clubes por ronda ganada y por la Supercopa los paga la Asociación. Ingresás derechos y taquilla por cada ronda (más en semifinales y final). Una política generosa cuesta más pero mejora la aprobación; una austera la reduce.</p><div class=\"btn-group\">":"<p class=\"sm\">Os prêmios aos clubes por fase vencida e pela Supercopa são pagos pela Federação. Você recebe direitos e bilheteria em cada fase (mais nas semifinais e na final). Uma política generosa custa mais, mas melhora a aprovação; uma austera a reduz.</p><div class=\"btn-group\">","<p class=\"sm\">Mandato: te queda una temporada más.</p><button class=\"big\" onclick=\"presCont()\">Continuar como Presidente</button> <button onclick=\"presDecline()\">Renunciar al cargo (volver a dirigir)</button>":"<p class=\"sm\">Mandato: resta mais uma temporada.</p><button class=\"big\" onclick=\"presCont()\">Continuar como Presidente</button> <button onclick=\"presDecline()\">Renunciar ao cargo (voltar a treinar)</button>","<p class=\"sm\">Nivel actual: <b>":"<p class=\"sm\">Nível atual: <b>","<p class=\"sm\">Nivel máximo.</p>":"<p class=\"sm\">Nível máximo.</p>","<p class=\"sm\">No tenés suplentes disponibles de ":"<p class=\"sm\">Você não tem reservas disponíveis de ","<p class=\"sm\">No tenés suplentes disponibles en esa línea: el lugar lo ocupa un jugador de otra posición, con penalización.</p>":"<p class=\"sm\">Você não tem function scNorm(P){const c=(x,a,b)=>Math.max(a,Math.min(b,x)),o=Object.assign(SCD(),P);
  o.amin=c(Math.round(o.amin),15,45);o.amax=c(Math.round(o.amax),15,45);if(o.amin>o.amax){const x=o.amin;o.amin=o.amax;o.amax=x}

function getTopTwo(country){
  const countryTeams = G.teams.map((t,i)=>({t,i})).filter(x=>x.t.country===country && x.t.div===1);
  if(countryTeams.length<2)return[];
  if(!G.hist || G.hist.length===0){
    countryTeams.sort((a,b)=>ovr(b.t)-ovr(a.t));
    return [countryTeams[0].i, countryTeams[1].i];
  }
  const lastHist = G.hist[G.hist.length-1];
  const sorted = countryTeams.sort((a,b)=>{
    const pa = lastHist.rankings ? lastHist.rankings[a.i] || 99 : 99;
    const pb = lastHist.rankings ? lastHist.rankings[b.i] || 99 : 99;
    return pa - pb;
  });
  return [sorted[0].i, sorted[1].i];
}

// ===== Libro de pases =====
// Los traspasos entre clubes (compras, cesiones, ventas y ofertas) solo se hacen mientras la próxima fecha de liga
// sea de la 1 a la 5 o de la 16 a la 20. Afecta a los jugadores con contrato vigente en un club de liga jugable;
// los agentes libres (sin contrato con ningún club) se fichan siempre.
const TW=[[1,5],[16,20]];
const trOn=()=>!G||G.tw!==false; // partidas guardadas sin esta opción siguen con ventanas
const trOpen=()=>{if(!trOn())return true;if(!G||!G.fx||G.w>=G.fx.length)return false;const f=G.w+1;return TW.some(([a,b])=>f>=a&&f<=b)};
const trNext=()=>{const f=G.w+1,w=TW.find(([a])=>a>f);return w?w[0]:null};
const trMsg=()=>_t('🔒 El libro de pases está cerrado: los traspasos entre clubes solo se hacen durante las fechas 1 a 5 y 16 a 20 de la liga')+(trNext()?_t(' (vuelve a abrir en la fecha ')+trNext()+')':_t(' (vuelve a abrir al comenzar la próxima temporada)'))+_t('. Los agentes libres (sin contrato con ningún club) se pueden fichar siempre.');
function trUI(){if(!trOn())return '';if(trOpen()){const f=G.w+1,w=TW.find(([a,b])=>f>=a&&f<=b);return _t('<p class="sm news">🟢 <b>Libro de pases abierto</b> (fechas ')+w[0]+_t(' a ','rango')+w[1]+_t('): cierra después de la fecha ')+w[1]+'.</p>'}return '<p class="sm news">'+trMsg()+'</p>'}
// ===== Contratos de jugadores (sistema simple: solo duración; los sueldos siguen con el cálculo global) =====
// p.ct = temporadas de contrato que le quedan (contando la actual). Al terminar la temporada baja 1; si llega a 0, queda libre.
// p.mh = tiempos jugados en la temporada (cada partido son 2); t.mh = tiempos que jugó su club.
const ctNew=p=>p.age<=23?4:p.age<=27?3:p.age<=31?2:1;            // duración al fichar o comprar
const ctSign=p=>{p.ct=ctNew(p);delete p.xc;delete p.fa;return p};
const ctTxt=p=>p.ct==null?'—':p.ct<=1?_t('⚠️ último año'):p.ct+_t(' temporadas');
// Disposición del jugador a renovar por 'y' temporadas: minutos jugados, si se siente por encima de su club
// (y la chance de que lo quiera uno mejor), su edad y su personalidad.
function rnScore(p,t,y){if(p.rz==null)p.rz=Math.round((Math.random()*.2-.1)*100)/100;
  const pl=(t.mh||0)>=6?Math.min(1,(p.mh||0)/t.mh):.5,gap=p.r-ovr(t),up=gap>0;
  let s=.55+(pl-.5)*.6-Math.max(0,gap)/12*.35-(up?(t.div==3?.25:t.div==2?.15:EUL(t.country)?0:.05)+(SAMC(t)?.08:0):0);
  if(p.age>=30)s+=.06*(y-1);else if(up&&p.age<=26)s-=.07*(y-1);else s+=.02*(y-1);
  return s+p.rz}
const rnLbl=v=>v>=.6?_t('<b style="color:var(--success)">Alta</b>'):v>=.5?_t('<b style="color:var(--accent-gold)">Media</b>'):_t('<b style="color:var(--danger)">Baja</b>');
function myCtP(){const t=G.teams[G.me],own=t.sq.map(p=>({p,t,away:null})),lo=[];G.teams.forEach((T,i)=>{if(i!=G.me)T.sq.forEach(p=>{if(p.originalOwner===G.me)lo.push({p,t,away:T})})});return own.concat(lo)}
function renew(n){const t=G.teams[G.me],e=myCtP().find(x=>x.p.n===n);if(!e)return;const p=e.p,el=document.getElementById('rny_'+n.replace(/\W/g,'_')),y=Math.max(1,Math.min(4,parseInt(el&&el.value)||2));
  if(p.ct>1){G.msg=p.n+_t(' todavía tiene ')+p.ct+_t(' temporadas de contrato: se renueva en su último año.');render();return}
  if(rnScore(p,t,y)>=.5){p.ct=1+y;G.msg='✍️ '+p.n+_t(' renovó por ')+y+(y>1?_t(' temporadas'):_t(' temporada'))+_t(' más.')}
  else G.msg='❌ '+p.n+_t(' no acepta renovar por ')+y+(y>1?_t(' temporadas'):_t(' temporada'))+_t('. Probá con otra duración o dale más minutos.');render()}
function ctUI(){const L=myCtP().filter(x=>x.p.ct!=null&&x.p.ct<=1);if(!L.length)return '';
  return win(_t('📄 Renovaciones de contrato (')+L.length+')',_t('<p class="sm">Estos jugadores terminan su contrato al final de la temporada: si no renuevan, se van libres. Cada uno decide según los minutos que juega, si se siente por encima del club y la duración que le ofrecés (los veteranos prefieren contratos largos; los jóvenes que se creen mejores que su club, cortos).</p><div class="sc"><table><tr><th>Pos</th><th>Jugador</th><th>Edad</th><th>Nivel</th><th>Minutos</th><th>Disposición</th><th>Renovar por</th><th></th></tr>')+L.map(({p,t,away})=>{const id='rny_'+p.n.replace(/\W/g,'_'),best=Math.max(...[1,2,3,4].map(y=>rnScore(p,t,y))),pl=(t.mh||0)>=6?Math.round(Math.min(1,(p.mh||0)/t.mh)*100)+'%':'—';
    return '<tr><td><span class="badge badge-'+p.p.toLowerCase()+'">'+PLB(p)+'</span></td><td>'+p.n+(away?_t(' <span class="sm">(cedido en ')+away.n+')</span>':'')+'</td><td>'+p.age+'</td><td><b>'+p.r+'</b></td><td>'+(away?'—':pl)+'</td><td>'+rnLbl(best)+'</td><td><select id="'+id+'">'+[1,2,3,4].map(y=>'<option value="'+y+'"'+(y==2?' selected':'')+'>'+y+(y>1?_t(' temporadas'):_t(' temporada'))+'</option>').join('')+'</select></td><td><button onclick="renew(\''+p.n.replace(/'/g,"\\'")+_t('\')">Ofrecer</button></td></tr>')}).join('')+'</table></div>')}
// Fin de temporada: vencen los contratos. Los clubes de la IA renuevan a quien les sirve (si el jugador acepta);
// los que se van quedan libres: los del manager siempre llegan al Mercado; de la IA, solo los mejores (el resto se va a otras ligas).
function ctEnd(reps){const pool=[],ai=[];
  G.teams.forEach((t,ti)=>{const hk=G.pl.indexOf(ti),hum=isHum(ti);
    t.sq.slice().forEach(p=>{if(p.ct==null)p.ct=R(1,4);p.ct--;if(p.ct>0)return;
      if(!hum){const want=(p.r>=ovr(t)-4&&p.age<=32)||p.r>=ovr(t)+2,y=ctNew(p);if(want&&rnScore(p,t,y)>=.5){p.ct=y;return}}
      t.sq.splice(t.sq.indexOf(p),1);if(t.lu)t.lu=t.lu.filter(x=>x!==p.n);p.xc=true;p.fa=true;p.disc=.35;p.boughtThisSeason=false;p.originalOwner=null;
      if(hum){pool.push(p);if(hk>=0)reps[hk].push('📄 '+p.n+' ('+p.p+', '+p.r+_t(') terminó su contrato y se fue libre.'))}else ai.push(p)})});
  // un manager nunca queda con menos de 14: sube juveniles de la cantera
  G.pl.forEach((ci,k)=>{const t=G.teams[ci];if(!isHum(ci))return;while(t.sq.length<MINSQ){const p=POS.map(q=>[q,AIBASE[q]-t.sq.filter(x=>x.p==q).length]).sort((a,b)=>b[1]-a[1])[0][0],y=mkP(p,52,natOf(t),t.sq.concat(t.acad||[]));y.age=R(17,19);y.r=R(44,58);y.ct=3;t.sq.push(y);reps[k].push(_t('Para completar el plantel subió de la cantera ')+y.n+' ('+y.p+', '+y.r+').')}});
  G.teams.forEach(t=>{t.mh=0;t.sq.forEach(p=>{p.mh=0})});
  return pool.concat(ai.sort((a,b)=>b.r-a.r).slice(0,30))}
// ===== Sudamérica, semillero de Europa =====
const vct=p=>val(p)*(p.ct==1?.75:p.ct==2?.9:1);
const SAMC=t=>!!t&&CONT[t.country]=='SAM',EURC=t=>!!t&&CONT[t.country]=='EUR';
function sellErr(S,p){if(S.sq.length<=MINSQ)return S.n+_t(' se quedaría con menos de ')+MINSQ+_t(' jugadores.');if(S.sq.filter(x=>x.p==p.p).length<=MIN[p.p])return S.n+_t(' se quedaría sin ')+p.p+_t(' suficientes.');return''}
function tfeed(t){G.tf=[t].concat(G.tf||[]).slice(0,12)}
function aiEcon(){G.teams.forEach((t,i)=>{if(!isHum(i))t.bud=Math.round(((t.bud==null?R(12,35):t.bud)+(t.div==3?.15:t.div==2?.3:.6))*10)/10});aiFill()}
// Los clubes de la IA no bajan de AIMIN jugadores ni de 11 disponibles: si les falta gente, suben juveniles a la línea más corta.
const AIMIN=16,AIBASE={POR:2,DEF:5,MED:5,DEL:4};
function aiFill(){G.teams.forEach((t,i)=>{if(isHum(i)||!t.sq)return;const avl=()=>t.sq.filter(x=>!(x.i>0||x.s>0||x.cv>0)).length;while(t.sq.length<AIMIN||(avl()<11&&t.sq.length<MAXSQ)){
  const p=POS.map(q=>[q,AIBASE[q]-t.sq.filter(x=>x.p==q).length]).sort((a,b)=>b[1]-a[1])[0][0],lv=ovr(t);
  const fa=(G.mk||[]).filter(x=>x.xc&&x.p==p&&x.r>=lv-12&&x.r<=lv+4&&!cupoErr(i,x)&&mprice(x)<=(t.bud||0)).sort((a,b)=>b.r-a.r)[0];
  if(fa){G.mk.splice(G.mk.indexOf(fa),1);t.bud=Math.round(((t.bud||0)-mprice(fa))*10)/10;delete fa.disc;ctSign(fa);fa.boughtThisSeason=true;t.sq.push(fa);tfeed(t.n+' ['+t.country+_t('] fichó al agente libre ')+fa.n+' ('+_t(fa.p)+' '+fa.r+')');continue}
  const y=mkP(p,52,natOf(t),t.sq.concat(t.acad||[]));y.age=R(17,19);y.r=R(44,58);y.ct=R(2,3);t.sq.push(y)}})}

function aiTransfers(n){
  const ai=G.teams.map((t,i)=>i).filter(i=>!isHum(i));
  ai.forEach(i=>{if(G.teams[i].bud==null)G.teams[i].bud=R(12,35)});
  
  for(let k=0;k<n;k++){
    const bi=pick(ai),B=G.teams[bi];if(B.sq.length>=MAXSQ)continue;let best=null;
    for(let j=0;j<24;j++){
      const sa=EURC(B)&&Math.random()<.35?ai.filter(i=>SAMC(G.teams[i])):null,si=sa&&sa.length?pick(sa):pick(ai);if(si==bi||(G.bc[bi+'>'+si]||0)>=2)continue;const S=G.teams[si],p=pick(S.sq);if(sellErr(S,p)||S.sq.length<=15)continue;
      if(p.boughtThisSeason) continue;
      if(cupoErr(bi,p))continue;
      if(surCnt(B,sn(p.n))>=2)continue;
      const price=Math.round(vct(p)*(EURC(B)&&SAMC(S)?1.3+Math.random()*.2:1.1)*10)/10;if(price>B.bud)continue;
      const line=B.sq.filter(x=>x.p==p.p).map(x=>x.r).sort((a,b)=>b-a),need=FORM[B.form][POS.indexOf(p.p)],cut=line[need-1]||40;
      if(p.r<=cut+1)continue;if(!best||p.r>best.p.r)best={si,S,p,price}
    }
    if(best){
      const{si,S,p,price}=best;S.sq.splice(S.sq.indexOf(p),1);p.boughtThisSeason=true;ctSign(p);B.sq.push(p);G.bc[bi+'>'+si]=(G.bc[bi+'>'+si]||0)+1;B.bud=Math.round((B.bud-price)*10)/10;S.bud=Math.round(((S.bud||0)+price*.8)*10)/10;presFee(price,B,S);
      tfeed(B.n+' ['+B.country+_t('] compró a ')+p.n+' ('+_t(p.p)+' '+p.r+_t(') de ')+S.n+' ['+S.country+_t('] por ')+f1(price)+' M')
    }
  }

  G.pl.forEach(humanIdx => {
    const Hs = SAMC(G.teams[humanIdx]), eu = ai.filter(i=>EURC(G.teams[i]));
    if(Math.random() < (Hs ? 0.6 : 0.45)) {
      const buyerIdx = Hs && eu.length && Math.random() < 0.5 ? pick(eu) : pick(ai);
      const prem = Hs && EURC(G.teams[buyerIdx]);
      const B = G.teams[buyerIdx];
      const H = G.teams[humanIdx];
      if(B.sq.length < MAXSQ && H.sq.length > MINSQ) {
        const candidates = H.sq.filter(p => !p.boughtThisSeason && !cupoErr(buyerIdx,p) && !G.offers.some(o => o.from == buyerIdx && o.n == p.n));
        if(candidates.length > 0) {
          const p = pick(candidates);
          const isLoan = Math.random() < (prem ? 0.15 : 0.35);
          if(isLoan) {
            const fee = Math.round(vct(p) * 0.2 * 10) / 10;
            if(B.bud >= fee) {
              G.oid = (G.oid || 0) + 1;
              G.offers.push({ id: G.oid, from: buyerIdx, to: humanIdx, n: p.n, price: fee, type: 'loan' });
              notify(humanIdx, '📨 ' + B.n + ' ['+B.country+_t('] quiere la CESIÓN de ') + p.n + _t(' por ') + f1(fee) + ' M.');
            }
          } else {
            const price = Math.round(vct(p) * (prem ? 1.3 + Math.random() * 0.2 : 1.1 + Math.random() * 0.2) * 10) / 10;
            if(B.bud >= price) {
              G.oid = (G.oid || 0) + 1;
              G.offers.push({ id: G.oid, from: buyerIdx, to: humanIdx, n: p.n, price: price, type: 'buy' });
              notify(humanIdx, '📨 ' + B.n + ' ['+B.country+_t('] ofertó ') + f1(price) + _t(' M para COMPRAR a ') + p.n + '.');
            }
          }
        }
      }
    }
  });
}

function offer(ci,pi,prOv,tyOv){
  const t=G.teams[ci],p=t.sq[pi],el=document.getElementById('ofr'+pi),typeEl=document.getElementById('ofrtype'+pi),price=prOv!=null?Math.round(prOv*10)/10:Math.round(parseFloat(el&&el.value)*10)/10,type=tyOv||(typeEl?typeEl.value:'buy'),key=G.me+'>'+ci,B=G.teams[G.me];
  const bad=m=>{G.msg=m;render()};
  if(!trOpen())return bad(trMsg());
  if(!(price>0))return bad(_t('Poné un precio válido.'));
  if(price>G.bud)return bad(_t('No te alcanza el presupuesto para esa oferta.'));
  if(B.sq.length>=MAXSQ)return bad(_t('Tu plantilla está llena (máx. ')+MAXSQ+').');
  if((G.bc[key]||0)>=2)return bad(_t('Ya realizaste 2 operaciones con este club esta temporada.'));
  if(p.boughtThisSeason) return bad(_t('Este jugador fue transferido o cedido recientemente y no se puede mover de nuevo esta temporada.'));
  if(cupoErr(G.me,p))return bad(cupoErr(G.me,p));

  if(!G.pl.includes(ci)){
    const rk=key+'|'+p.n+'|'+type;
    if(G.rej.includes(rk))return bad(_t('Ya rechazaron tu oferta por ')+p.n+_t(': probá de nuevo la próxima jornada.'));
    const e=sellErr(t,p);if(e)return bad(e);

    const minPrice = type === 'loan' ? vct(p) * 0.18 : vct(p) * 1.05;
    if(price < minPrice * (1 + Math.random() * 0.2)){
      G.rej.push(rk);
      return bad(t.n+_t(' rechazó tu oferta de ')+(type==='loan'?_t('cesión'):'compra')+_t(' por ')+p.n+_t('. Esperaban más.'));
    }

    t.sq.splice(pi,1);
    p.boughtThisSeason = true;
    if(type === 'loan') {
      p.originalOwner = ci;
    } else ctSign(p);
    B.sq.push(p);
    G.bc[key]=(G.bc[key]||0)+1;
    t.bud=Math.round(((t.bud||0)+price*.8)*10)/10;presFee(price,B,t);
    G.bud=Math.round((G.bud-price)*10)/10;
    tfeed(B.n+' ['+B.country+']'+(type==='loan'?_t(' obtuvo la cesión de '):_t(' compró a '))+p.n+' ('+_t(p.p)+' '+p.r+_t(') de ')+t.n+' ['+t.country+_t('] por ')+f1(price)+' M');
    return bad('✅ '+t.n+_t(' aceptó: ')+p.n+_t(' llegó ')+(type==='loan'?_t('cedido'):_t('en propiedad'))+_t(' por ')+f1(price)+' M.');
  }

  G.offers=G.offers.filter(o=>!(o.from==G.me&&o.to==ci&&o.n==p.n));G.oid=(G.oid||0)+1;
  G.offers.push({id:G.oid,from:G.me,to:ci,n:p.n,price,type});
  notify(ci,'📨 '+B.n+' ['+B.country+_t('] ofreció ')+(type==='loan'?_t('CESIÓN'):_t('COMPRA'))+_t(' de ')+f1(price)+_t(' M por ')+p.n+_t('. Respondé en Mercado.'));
  G.msg=_t('Oferta enviada a ')+t.n+_t(' por ')+p.n+'.';render();
}

function respond(id,acc){
  const i=G.offers.findIndex(o=>o.id==id);if(i<0)return;
  const o=G.offers[i],S=G.teams[o.to],B=G.teams[o.from],pi=S.sq.findIndex(x=>x.n==o.n),p=S.sq[pi];
  const isLoan = o.type === 'loan';

  if(!acc){
    G.offers.splice(i,1);
    if(G.me==o.to && G.pl.includes(o.from)) notify(o.from,'❌ '+S.n+_t(' rechazó tu oferta por ')+o.n+'.');
    G.msg=_t('Oferta ')+(G.me==o.to?_t('rechazada'):_t('cancelada'))+'.';render();return;
  }

  if(G.me!=o.to)return;
  let err='';
  if(!trOpen())err=trMsg();
  else if(!p)err=_t('El jugador ya no está en el club.');
  else if(p.boughtThisSeason)err=_t('Un jugador transferido/cedido esta temporada no puede volver a cambiar de club.');
  else if(S.sq.length<=14)err=_t('Te quedarías con menos de 14 jugadores.');
  else if(S.sq.filter(x=>x.p==p.p).length<=MIN[p.p])err=_t('Te quedarías sin ')+p.p+_t(' suficientes.');
  else if(B.sq.length>=MAXSQ)err=_t('El club comprador tiene la plantilla llena.');
  else if(cupoErr(o.from,p))err=_t('El club comprador no tiene cupo de extranjeros disponible (máx. ')+MAXFOR+').';

function table(country, d){

  G.res.forEach(w=>w.forEach(([h,a,gh,ga])=>{
    const H=t[h],A=t[a];
    H.pj++;A.pj++;H.gf+=gh;H.gc+=ga;A.gf+=ga;A.gc+=gh;

          .sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf);
}

function train(){
  const t=G.teams[G.me],iv=t.tr.i&&G.bud>=trc(t);
  // Semillero: cada jornada cada juvenil puede subir 1 punto. La chance depende de la calidad del entrenador
// de juveniles, del nivel del Semillero y de cuánto le falta para su potencial (cerca del techo, avanza más lento).
  const cj=cos(t).JUV,yup=[];if(cj)t.acad.forEach(y=>{const gap=y.pot-y.r;if(gap>0&&Math.random()<Math.min(.85,(cj.q-25)/100*.5*(1+semC(t).ev)*Math.min(1,gap/8)*(SAMC(t)?1.2:1))){y.r++;yup.push(y.n+' ('+y.r+')')}});
  if(iv)G.bud=Math.round((G.bud-trc(t))*100)/100;
  
  if(!t.tr || typeof t.tr.p==='string') t.tr = { p: { POR: null, DEF: null, MED: null, DEL: null }, i: 0 };
  
  const up=[],nc=[];if(!cj&&t.acad.length)nc.push(CPN.JUV);
  POS.forEach(pos => {
    const sel = trSel(t, pos);
    if(sel.length) {
      const c = cos(t)[pos];
      if(!c){nc.push(_t(CPN[pos]));return}
      sel.slice(0, trCap(c.q)).forEach(pName => {
        const p = t.sq.find(x => x.n === pName && x.p === pos);
        if(p && p.r < 92 && Math.random() < Math.min(.9, (c.q-25)/100*.2*(iv ? 2.2 : 1) * agef(p.age) * (SAMC(t)&&p.age<=23?1.2:1))) {
          p.r++;
          up.push(p.n);
        }
      });
    }
  });

  return(iv?_t('Entrenamiento intensivo: −')+f2(trc(t))+' M. ':t.tr.i?_t('Sin fondos para entrenamiento intensivo. '):'')+(nc.length?_t('Sin entrenador de ')+nc.join(', ')+_t(': no se entrenó. '):'')+(up.length?_t('Mejoraron: ')+up.join(', ')+'.':_t('Nadie mejoró esta semana.'))+(yup.length?_t(' 🌱 Juveniles que progresaron: ')+yup.join(', ')+'.':'')
}

  const taken=SETUP.cl.filter((_,j)=>j!==k&&j<SETUP.n);
  return G.teams.findIndex((t,i)=>t.country===country&&t.div===div&&!taken.includes(i))>=0
    ? G.teams.findIndex((t,i)=>t.country===country&&t.div===div&&!taken.includes(i))
    : G.teams.findIndex(t=>t.country===country&&t.div===div);
}
function setupCountry(k,country){
  const old=G.teams[SETUP.cl[k]],div=old&&old.country===country?old.div:1;
  const next=setupFirstClub(country,div,k);
  if(next>=0)SETUP.cl[k]=next;
  render();
}
function setupDivision(k,div){

      h = headerImg + navSub + '<div class="btn-group" style="margin-bottom:8px;">'+[1,2,3].map(k=>`<button class="${d==k?'on':''}" onclick="TD=${k};render()">${_t(DN[k-1])} (${curCountry})</button>`).join('')+'</div>'+(d==1&&BOOST({country:curCountry,div:1})>1?_t('<p class="sm">⭐ Los clubes de Primera de ')+_t(CNM[curCountry])+_t(' tienen jugadores de calidad un 15% superior: se refleja en los puntajes y en el nivel del club. Al descender el plantel pierde ese plus; al ascender, lo gana. Sus ingresos por partidos y sponsor son 1,4 veces mayores, para sostener esos planteles.</p>'):'')+win(_t('Clasificación — ')+_t(DN[d-1])+' ('+curCountry+')',_t('<table><tr><th>#</th><th>Club</th><th>PJ</th><th>DG</th><th>Pts</th></tr>')+tt.map((r,i)=>{
        let arrow = '';
        if(d == 1 && i >= tt.length - 3) arrow = '<span style="color:var(--danger);margin-right:4px;">🔻</span>';
        else if(d == 2 && i < 3) arrow = '<span style="color:var(--success);margin-right:4px;">🟢</span>';
        else if(d == 3 && i < 1) arrow = '<span style="color:var(--success);margin-right:4px;">🟢</span>';
        if(d == 2 && i == tt.length - 1) arrow = '<span style="color:var(--danger);margin-right:4px;">🔻</span>';
        if(d == 1 && i < 2) arrow = '<span style="margin-right:4px;" title="Clasifica a la '+(CONT[curCountry]=='EUR'?_t('Copa Europea'):_t('Copa Internacional'))+'">🏆</span>';
        return `<tr class="${r.i==G.me?'me':''}"><td>${arrow}${i+1}</td><td>${lk('L'+r.i)}</td><td>${r.pj}</td><td>${r.gf-r.gc}</td><td><b>${r.pts}</b></td></tr>`;
      }).join('')+'</table>')+goleadores(curCountry, d);
    } else if(subTab=='ncup'){
      h = headerImg + navSub + ncUI(me.country);
    } else if(subTab=='nat'){
      h = headerImg + navSub + natUI();
    } else if(subTab=='ic'){
      h = headerImg + navSub + icUI();
    } else {
      h = headerImg + navSub + cupUI(subTab=='ecup'||(subTab!='cup'&&CONT[me.country]=='EUR')?'ecup':'cup');
    }
  }

  if(T=='market'){
    let headerImg = `${_t("<div class=\"menu-header-img bg-market\"><div class=\"menu-header-title\">🤝 Mercado de Traspasos</div></div>")}`;
    const navSub = `<div class="nav-sub">
      <button class="${subTab=='mk'?'on':''}${_t("\" onclick=\"subTab='mk';render()\">Mercado Libres / Ofertas</button>\n      <button class=\"")}${subTab=='clubs'?'on':''}${_t("\" onclick=\"subTab='clubs';render()\">Explorar Clubes</button>\n      <button class=\"")}${subTab=='coach'?'on':''}${_t("\" onclick=\"subTab='coach';render()\">Empleados 🧑‍🏫</button>\n      <button class=\"")}${subTab=='scout'?'on':''}${_t("\" onclick=\"subTab='scout';render()\">Ojeador 🔎</button>\n    </div>")}`+trUI();
    const balMk = `${_t("<div class=\"eco-card\"><div><div style=\"font-size:11px;color:var(--fg-sub);\">BALANCE ECONÓMICO</div><div style=\"font-size:20px;font-weight:800;color:var(--primary);\">$")}${f1(G.bud)} M</div></div></div>`;

    if(subTab=='mk'){
      h = headerImg + balMk + navSub + win(_t('Agentes Libres'),_t('<div class="sc"><table><tr><th>Pos</th><th>Jugador</th><th>Nac.</th><th>Edad</th><th>Nivel</th><th>Precio</th><th>Acción</th></tr>')+(G.mk.map((p,i)=>`<tr><td><span class="badge badge-${p.p.toLowerCase()}">${PLB(p)}</span></td><td><div class="player-cell">${getAvatarSVG(p.n, p.p)}${p.n}${p.fa?_t(' <span class="sm">🆓 libre</span>'):''}</div></td><td>${natB(p,G.teams[G.me])}</td><td>${p.age}</td><td><b>${p.r}</b></td><td><s>${f1(val(p))}</s> <b style="color:var(--primary);">${f1(mprice(p))} M</b></td><td><button onclick="buy(${i})" ${cupoErr(G.me,p)?_t('disabled title="Cupo de extranjeros completo"'):''}${_t(">Fichar</button></td></tr>")}`).join('')||_t('<tr><td colspan=7>No hay jugadores en el mercado libre.</td></tr>'))+'</table></div>');
      h += offersUI();
      h += win(_t('Historial de Traspasos'),_t('<p class="sm news">Últimos movimientos del mercado internacional.</p>')+(G.tf&&G.tf.length?'<ul style="margin:0;padding-left:18px">'+G.tf.map(x=>'<li>'+x+'</li>').join('')+'</ul>':_t('<p class="sm">Sin transferencias recientes.</p>')));
    } else if(subTab=='coach'){
      h = headerImg + balMk + navSub + coachUI(me);
    } else if(subTab=='scout'){
      h = headerImg + balMk + navSub + scoutUI(me);
    } else {
      const id=VC||'L'+G.me,t=tm(id),isL=id[0]=='L',idx=+id.slice(1),canBuy=isL&&idx!=G.me;
      const og=(l,ids)=>ids.length?`<optgroup label="${l}">`+ids.map(i=>{const q=tm(i);return `<option value="${i}" ${i==id?'selected':''}>${q.n} [${q.country||'INT'}${_t("] · nivel ")}${ovr(q)}</option>`}).join('')+'</optgroup>':'';
      
      h = headerImg + balMk + navSub + win(_t('Buscador de Clubes'),`${_t("<p>Seleccionar club:</p><select onchange=\"VC=this.value;render()\">")}${CTRY.map(c=>og(_t(CNM[c])+_t(' - Primera'),table(c,1).map(r=>'L'+r.i))+og(_t(CNM[c])+_t(' - Segunda'),table(c,2).map(r=>'L'+r.i))+og(_t(CNM[c])+_t(' - Tercera'),table(c,3).map(r=>'L'+r.i))).join('')}${og(_t('Copa Internacional (Resto)'),G.foreign.map((q,i)=>'F'+i))}${og(_t('Copa Europea (Resto)'),(G.foreignE||[]).map((q,i)=>'E'+i))}</select>`)
      +win(t.n+(t.c?' ('+t.c+')':t.country?' ['+t.country+']':''),`${_t("<p>Nivel ")}${ovr(t)} ${isL?' · '+_t(DN[t.div-1])+' ('+t.country+')':''}${_t("</p><div class=\"sc\"><table><tr><th>Pos</th><th>Jugador</th><th>Nac.</th><th>Edad</th><th>Nivel</th><th>Goles</th><th>Lesión</th><th>Contrato</th>")}${canBuy?_t('<th>Ofertar</th>'):''}</tr>`+ord(t.sq).map(p=>`<tr><td><span class="badge badge-${p.p.toLowerCase()}">${PLB(p)}</span></td><td><div class="player-cell">${getAvatarSVG(p.n, p.p)}${p.n}${p.originalOwner!==null&&p.originalOwner!==undefined?_t(' <span style="color:var(--accent-gold);font-size:10px;">[CEDIDO]</span>'):''}</div></td><td>${natB(p,t)}</td><td>${p.age}</td><td><b>${p.r}</b></td><td>${isL?((G.sc[idx+'|'+p.n]||{g:0}).g):'-'}</td><td>${p.i>0?'🩹 '+p.i:''}</td><td>${isL?ctTxt(p):'—'}</td>${canBuy?`<td>
        <select id="ofrtype${t.sq.indexOf(p)}${_t("\" style=\"font-size:11px;padding:2px;\">\n          <option value=\"buy\">Compra</option>\n          <option value=\"loan\">Cesión</option>\n        </select>\n        <input id=\"ofr")}${t.sq.indexOf(p)}" type="number" min="0.1" step="0.1" value="${(Math.round((isL?vct(p):val(p))*1.1*10)/10).toFixed(1)}" style="width:4.5em"> 
        <button onclick="offer(${idx},${t.sq.indexOf(p)})" ${p.boughtThisSeason?_t('disabled title="Bloqueado por transferencia reciente"'):''}${_t(">Ofertar</button>\n      </td>")}`:''}</tr>`).join('')+'</table></div>');
    }
  }

  const ok=save();
  A.innerHTML = win(`⚽ ${G.pl.length>1?G.names[G.cur]+' · ':''}${me.n} [${me.country}${_t("] — Temporada ")}${G.s}`, `${ok?'':_t('<p class="m">⚠️ No se pudo guardar la partida en este navegador: si cerrás o recargás la página, se pierde el progreso.</p>')}${msg}${askLeave?leaveUI():''}${askJoin?joinUI():''}${askNew?_t('<p><b>¿Borrar la partida actual?</b> <button onclick="fresh()">Sí, nueva partida</button> <button onclick="askNew=false;render()">Cancelar</button></p>'):''}`) + navMain + h;
}

function clk(){const d=new Date();document.getElementById('clk').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
clk();setInterval(clk,30000);


// ===== Estadísticas anónimas de uso (Google Sheets + Apps Script) =====
// Envía: inicio de sesión, minutos activos (solo con la pestaña visible) y eventos de la partida.
// No se envía ningún dato personal: el jugador se identifica con un código al azar guardado en este navegador.
const ST_URL='https://script.google.com/macros/s/AKfycbzTLj4YJz2CdNwqheL02p08txZKAWH5DyAnGBBASqsl8V6j_W2Gv2_JDc6st-qu6e3W0A/exec',ST_KEY='cef-2026',ST_VER='4.82';
const stId=()=>'x'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const ST_PID=(()=>{try{let v=localStorage.getItem('cef_pid');if(!v){v=stId();localStorage.setItem('cef_pid',v)}return v}catch(e){return stId()}})(),ST_SID=stId();
function stSend(o){try{const b=JSON.stringify(Object.assign({k:ST_KEY,pid:ST_PID,sid:ST_SID},o));
  fetch(ST_URL,{method:'POST',mode:'no-cors',keepalive:b.length<60000,headers:{'Content-Type':'text/plain;charset=utf-8'},body:b}).catch(()=>{})}catch(e){}}
function stCtx(){try{const t=G&&G.teams&&G.me!=null?G.teams[G.me]:null;
  return{c:t?t.country:'',club:t?t.n:'',div:t?t.div:'',n:G&&G.pl?G.pl.length:'',tw:G&&G.pl?(G.tw===false?'no':'sí'):'',s:G&&G.pl?G.s:'',w:G&&G.pl&&G.fx?Math.min(G.w+1,G.fx.length):'',mode:G&&G.pl&&G.pres&&isPres()?'Presidente':G&&G.pl?'Manager':''}}catch(e){return{}}}
function stEv(ev,det){stSend(Object.assign({t:'ev',ev,det:det||''},stCtx()))}
// Inicio de sesión
stSend({t:'ses',dev:/iPad|Tablet/i.test(navigator.userAgent)||(/Android/i.test(navigator.userAgent)&&!/Mobile/i.test(navigator.userAgent))?'Tablet':/Mobi|Android|iPhone/i.test(navigator.userAgent)?'Celular':'Computadora',scr:screen.width+'x'+screen.height,lang:navigator.language||'',ver:ST_VER});
// Minutos activos: cuenta cada 15 s con la pestaña visible y avisa cada minuto nuevo
let stAct=0,stMin=0;
setInterval(()=>{if(document.visibilityState!=='visible')return;stAct+=15;const m=Math.floor(stAct/60);if(m>stMin){stMin=m;stSend({t:'hb',m})}},15000);
// Errores de JavaScript (hasta 10 distintos por sesión)
const stErrs=new Set();
function stErr(m){m=String(m||'').slice(0,250);if(!m||stErrs.has(m)||stErrs.size>=10)return;stErrs.add(m);stEv('error',m)}
window.addEventListener('error',e=>stErr((e.message||'Error')+(e.lineno?' (línea '+e.lineno+')':'')));
window.addEventListener('unhandledrejection',e=>stErr('Promesa: '+(e.reason&&e.reason.message||e.reason)));
// Eventos de la partida (se envuelven funciones existentes sin cambiar su comportamiento)
(()=>{const o=startGame;startGame=function(){o.apply(this,arguments);if(!SETUP.err&&G&&G.pl&&G.pl.length)stEv('nueva_partida')}})();
(()=>{const o=cont;cont=function(){o.apply(this,arguments);stEv('continuar_partida')}})();
(()=>{const o=newSeason;newSeason=function(){const s0=G.s;o.apply(this,arguments);if(G.s>s0)stEv('fin_temporada','Empieza la temporada '+G.s)}})();
(()=>{const o=presStart;presStart=function(){const was=!!G.pres;o.apply(this,arguments);if(!was&&G.pres)stEv('presidente','Asume como Presidente de '+(G.pres.country||''))}})();
// Secciones visitadas (cada sección se registra una vez por sesión)
const stSec=new Set();
(()=>{const o=render;render=function(){o.apply(this,arguments);try{if(!G||!G.pl||G.me==null)return;
  const a=document.querySelector('.nav-main button.on'),b=document.querySelector('.nav-sub button.on'),
    k=(a?a.textContent.trim():'')+(b?' › '+b.textContent.trim():'');
  if(k&&!stSec.has(k)){stSec.add(k);stEv('seccion',k)}}catch(e){}}})();

init();
SV=loadSave();
try{if(sessionStorage.getItem('cef_resume')){sessionStorage.removeItem('cef_resume');if(SV){cont();}}}catch(e){}
document.documentElement.lang=LANG;
render();
</script>
