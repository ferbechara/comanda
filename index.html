:root {
  --bg-dark: #0a0e17;
  --panel-bg: rgba(20, 27, 41, 0.85);
  --panel-border: #1e293b;

  --primary: #10b981;

  --accent-gold: #f59e0b;

  --fg-sub: #94a3b8;
  --danger: #ef4444;
  --warning: #f59e0b;
  --success: #10b981;
  --row-even: #121926;
  --me-bg: rgba(245, 158, 11, 0.15);
  --me-border: #f59e0b;
}

*{box-sizing:border-box}
body {
  margin: 0;
  color: var(--fg);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #070a10 linear-gradient(135deg, #070a10 0%, #0f172a 50%, #061121 100%);
  background-attachment: fixed;
  min-height: 100vh;
}

.w { max-width: 860px; margin: 0 auto; padding: 15px 12px 70px; }

.menu-header-img {
  width: 100%;
  height: 100px;
  border-radius: 8px 8px 0 0;
  background-size: cover;
  background-position: center;
  position: relative;
  display: flex;
  align-items: flex-end;
  padding: 12px;
}
.menu-header-img::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(20,27,41,1) 0%, rgba(20,27,41,0.2) 100%);
}
.menu-header-title {
  position: relative;
  z-index: 2;
  font-size: 20px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  display: flex;
  align-items: center;
  gap: 8px;
}

.bg-home { background: radial-gradient(circle, #10b981 0%, #064e3b 100%); }
.bg-tactics { background: linear-gradient(45deg, #0284c7, #0f172a); }
.bg-squad { background: linear-gradient(45deg, #3b82f6, #1e1b4b); }
.bg-cup { background: linear-gradient(45deg, #d97706, #451a03); }
.bg-market { background: linear-gradient(45deg, #8b5cf6, #2e1065); }

.win {
  background: var(--panel-bg);
  backdrop-filter: blur(12px);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  margin-bottom: 16px;
  overflow: hidden;
}

.tb {
  background: rgba(30, 41, 59, 0.8);
  color: var(--fg);
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--panel-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.bd { padding: 14px; overflow-x: auto; }

.lk { color: var(--accent); font-weight: 600; text-decoration: none; cursor: pointer; }
.lk:hover { text-decoration: underline; }

select, input {
  font: inherit;
  color: var(--fg);
  background: var(--card-bg);
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  padding: 6px 10px;
  outline: none;
}
select:focus, input:focus { border-color: var(--primary); }

.nav-main {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
  margin-bottom: 16px;
}

.nav-sub {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--panel-border);
  padding-bottom: 8px;
}

button {
  font: inherit;
  color: var(--fg);
  background: #1e293b;
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  padding: 6px 14px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
button:hover:not(:disabled) {
  background: #334155;
  border-color: var(--fg-sub);
  transform: translateY(-1px);
}
button:active:not(:disabled) { transform: translateY(0); }
button.on {
  background: var(--primary);
  color: #000;
  border-color: var(--primary);
  box-shadow: 0 0 12px var(--primary-glow);
}
button.big {
  font-size: 15px;
  font-weight: 700;
  padding: 10px 20px;
  background: linear-gradient(135deg, var(--primary), #059669);
  color: #000;
  border: none;
  box-shadow: 0 4px 14px var(--primary-glow);
}
button.secondary-big {
  font-size: 15px;
  font-weight: 700;
  padding: 10px 20px;
  background: linear-gradient(135deg, var(--accent), #2563eb);
  color: #fff;
  border: none;
}

.btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 8px; overflow: hidden; }
th, td { padding: 8px 10px; text-align: left; font-size: 13px; }
th { background: #0f172a; color: var(--fg-sub); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
tr:nth-child(even) td { background: var(--row-even); }
tr.me td { background: var(--me-bg) !important; font-weight: 700; color: #fff; }
tr.me { border-left: 3px solid var(--me-border); }

.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #334155;
  vertical-align: middle;
  margin-right: 8px;
  border: 1px solid rgba(255,255,255,0.2);
  display: inline-block;
}

.player-cell { display: flex; align-items: center; }

.sc { overflow-x: auto; }
.m { color: var(--danger); font-weight: 700; }
.sm { font-size: 12px; color: var(--fg-sub); }
.nat { display: inline-block; padding: 2px; border-radius: 4px; border: 1px solid transparent; line-height: 0; }
.nat.ext { border-color: var(--warning); box-shadow: 0 0 0 1px rgba(245,158,11,.35); }

.task {
  position: fixed; left: 0; right: 0; bottom: 0; height: 40px;
  background: #0f172a; border-top: 1px solid var(--panel-border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px; z-index: 100; font-size: 12px;
}

.badge {
  padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase;
}
.badge-por { background: #d97706; color: #fff; }
.badge-def { background: #2563eb; color: #fff; }
.badge-med { background: #059669; color: #fff; }
.badge-del { background: #dc2626; color: #fff; }
.badge-juv { background: #7c3aed; color: #fff; }

.eco-card {
  background: linear-gradient(135deg, rgba(16,185,129,0.1), rgba(15,23,42,0.6));
  border: 1px solid var(--primary);
  border-radius: 8px; padding: 12px; margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.bg-fin { background: linear-gradient(45deg, #f59e0b, #451a03); }
.match-banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:0 0 8px 8px;margin:-4px 0 12px;border:1px solid rgba(255,255,255,.12);color:#fff}
.match-banner .mb-ic{font-size:32px;line-height:1}
.match-banner .mb-t{font-size:18px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.match-banner .mb-d{font-size:13px;opacity:.92;margin-top:2px}
.mb-liga{background:linear-gradient(90deg,#1d4ed8,#1e293b)}
.mb-copa{background:linear-gradient(90deg,#b45309,#451a03)}
.mb-cont{background:linear-gradient(90deg,#047857,#022c22)}
.mb-intc{background:linear-gradient(90deg,#7c3aed,#1e1b4b)}
.mb-sup{background:linear-gradient(90deg,#be123c,#4c0519)}
.mb-libre{background:linear-gradient(90deg,#475569,#1e293b)}
.cal-t tr.maybe td{opacity:.65;font-style:italic}
/* Noticias: tipografía +30% (de 12px a 15,6px) */
.sm.news, .news { font-size: 15.6px; line-height: 1.5; }
.fin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 10px; }
.fin-kpi { background: var(--card-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 2px; }

.fin-bars { display: flex; align-items: flex-end; gap: 3px; height: 52px; padding: 4px 0; border-bottom: 1px solid var(--panel-border); }
.fin-bar { flex: 1; min-width: 5px; border-radius: 2px 2px 0 0; }
.fin-opt { background: var(--card-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }

, set your own selling price, and sales happen on every league matchday while there's stock. A high price gives more margin but sells less; a low one sells more with less margin. A better league position and a bigger fan base sell more.</p>","<p class=\"sm\">Fondo de solidaridad automático: cada jornada, los clubes en situación <b style=\"color:#ef4444\">Mala</b> reciben una cuota.</p><div class=\"btn-group\">":"<p class=\"sm\">Automatic solidarity fund: every matchday, clubs in a <b style=\"color:#ef4444\">Poor</b> situation receive a payment.</p><div class=\"btn-group\">","<p class=\"sm\">Intensivo (":"<p class=\"sm\">Intensive (","<p class=\"sm\">Juegan los campeones de la Copa Internacional (Sudamérica) y de la Copa Europea, más un representante de cada otro continente, que cambian cada temporada. Cuartos: África, Asia, Oceanía y Centro/Norteamérica. Semifinales: se suman los campeones de Europa y Sudamérica. Si tu club participa: +3 M por jugar la semifinal, +4 M por llegar a la final, +10 M si sos campeón (+2 M si perdés la final).</p><table><tr><th>Continente</th><th>Representante de esta temporada</th></tr>":"<p class=\"sm\">The champions of the International Cup (South America) and the European Cup play, plus one representative from each other continent, which change every season. Quarter-finals: Africa, Asia, Oceania and Central/North America. Semi-finals: the champions of Europe and South America join. If your club takes part: +3 M for playing the semi-final, +4 M for reaching the final, +10 M if you're champion (+2 M if you lose the final).</p><table><tr><th>Continent</th><th>This season's representative</th></tr>","<p class=\"sm\">Jóvenes promesas en formación. Nuevo juvenil cada ":"<p class=\"sm\">Young prospects in development. New youth player every ","<p class=\"sm\">La aprobación de cada club se actualiza <b>todas las jornadas</b> y tiende hacia un valor que depende de: (1) cuánto recibe respecto de lo esperado para su categoría, (2) su salud económica (Malo −6, Riesgoso −2, Saludable +1, Excelente +3), (3) los asuntos que resolvés (ayudas, reclamos, sedes, giras), (4) objetivos de la selección, (5) premios de Copa, streaming exclusivo (pequeños −5), caja en rojo y cuotas impagas. Cada decisión puntual mueve la aprobación al instante a la mitad de su efecto y el resto llega de a poco.</p>":"<p class=\"sm\">Each club's approval is updated <b>every matchday</b> and tends towards a value that depends on: (1) how much it gets compared with what's expected for its category, (2) its financial health (Poor −6, Risky −2, Healthy +1, Excellent +3), (3) the issues you resolve (aid, complaints, hosting, tours), (4) national team goals, (5) Cup prizes, exclusive streaming (small clubs −5), cash in the red and unpaid fees. Each one-off decision moves approval instantly by half its effect and the rest arrives gradually.</p>","<p class=\"sm\">La calidad (40 a 88) funciona igual que la de los entrenadores: <b>80 o más</b> entrega en 1 jornada · <b>65 a 79</b> en 2 · <b>52 a 64</b> en 3 · <b>menos de 52</b> en 4. Y encuentra de 2 jugadores (calidad 40) a 8 (calidad 88).</p>":"<p class=\"sm\">Quality (40 to 88) works the same as for coaches: <b>80 or more</b> delivers in 1 matchday · <b>65 to 79</b> in 2 · <b>52 to 64</b> in 3 · <b>below 52</b> in 4. And finds from 2 players (quality 40) to 8 (quality 88).</p>","<p class=\"sm\">La liga sigue en segundo plano. Tu club (":"<p class=\"sm\">The league continues in the background. Your club (","<p class=\"sm\">La selección juega las eliminatorias en el estadio sede: cuanto mejor es, más taquilla y más alquiler cobra el club. Para que más clubes puedan ser sede, subsidiá obras (la Asociación paga la mitad, el club la otra mitad) y ganás aprobación. El <b>Plan de estadios</b> lo hace solo cada 5 jornadas con hasta 2 clubes (los más ricos con estadio mejorable).</p><div class=\"btn-group\">":"<p class=\"sm\">The national team plays qualifiers at the host stadium: the better it is, the more ticket income and the more rent the club earns. So that more clubs can host, subsidise works (the Association pays half, the club the other half) and you gain approval. The <b>Stadium plan</b> does it automatically every 5 matchdays with up to 2 clubs (the richest ones with an upgradable stadium).</p><div class=\"btn-group\">","<p class=\"sm\">Los compromisos condicionales dependen de que avances de ronda o clasifiques. Importancia: Máxima (semifinales, finales e Intercontinental) · Alta (eliminación directa) · Media (liga y Supercopa).</p>":"<p class=\"sm\">Conditional fixtures depend on you advancing or qualifying. Importance: Maximum (semi-finals, finals and Intercontinental) · High (knockouts) · Medium (league and Super Cup).</p>","<p class=\"sm\">Los premios a los clubes por ronda ganada y por la Supercopa los paga la Asociación. Ingresás derechos y taquilla por cada ronda (más en semifinales y final). Una política generosa cuesta más pero mejora la aprobación; una austera la reduce.</p><div class=\"btn-group\">":"<p class=\"sm\">The Association pays the clubs' prizes per round won and for the Super Cup. You collect rights and ticket income for each round (more in the semi-finals and final). A generous policy costs more but improves approval; an austere one lowers it.</p><div class=\"btn-group\">","<p class=\"sm\">Mandato: te queda una temporada más.</p><button class=\"big\" onclick=\"presCont()\">Continuar como Presidente</button> <button onclick=\"presDecline()\">Renunciar al cargo (volver a dirigir)</button>":"<p class=\"sm\">Term: you have one more season left.</p><button class=\"big\" onclick=\"presCont()\">Continue as President</button> <button onclick=\"presDecline()\">Resign (return to managing)</button>","<p class=\"sm\">Nivel actual: <b>":"<p class=\"sm\">Current level: <b>","<p class=\"sm\">Nivel máximo.</p>":"<p class=\"sm\">Maximum level.</p>","<p class=\"sm\">No tenés suplentes disponibles de ":"<p class=\"sm\">You have no substitutes availa 2-3-1 e 4-1-3-2) também há posições específicas para cada tipo. No seu elenco: <b>","<p class=\"sm\">Esta temporada no hay Copa Nacional (empieza con la próxima).</p>":"<p class=\"sm\">Nesta temporada não há Copa Nacional (começa na próxima).</p>","<p class=\"sm\">Esta temporada no se disputa (empieza con la próxima).</p>":"<p class=\"sm\">Não é disputada nesta temporada (começa na próxima).</p>","<p class=\"sm\">Esta temporada no se disputa la Copa Intercontinental.</p>":"<p class=\"sm\">A Copa Intercontinental não é disputada nesta temporada.</p>","<p class=\"sm\">Estos jugadores terminan su contrato al final de la temporada: si no renuevan, se van libres. Cada uno decide según los minutos que juega, si se siente por encima del club y la duración que le ofrecés (los veteranos prefieren contratos largos; los jóvenes que se creen mejores que su club, cortos).</p><div class=\"sc\"><table><tr><th>Pos</th><th>Jugador</th><th>Edad</th><th>Nivel</th><th>Minutos</th><th>Disposición</th><th>Renovar por</th><th></th></tr>":"<p class=\"sm\">Estes jogadores terminam o contrato no fim da temporada: se não renovarem, saem livres. Cada um decide segundo os minutos que joga, se se sente acima do clube e a duração que você oferece (os veteranos preferem contratos longos; os jovens que se acham melhores que o clube, curtos).</p><div class=\"sc\"><table><tr><th>Pos</th><th>Jogador</th><th>Idade</th><th>Nível</th><th>Minutos</th><th>Disposição</th><th>Renovar por</th><th></th></tr>","<p class=\"sm\">Fabricás los productos pagando su costo por unidad, les ponés tu precio de venta y las ventas se producen en cada jornada de liga mientras haya stock. Un precio alto da más margen pero vende menos; uno bajo vende más con menos margen. Una mejor posición en la liga y una hinchada más grande venden más.</p>":"<p class=\"sm\">Você fabrica os produtos pagando o custo por unidade, define seu preço de venda e as vendas acontecem em cada rodada da liga enquanto houver estoque. Um preço alto dá mais margem, mas vende menos; um baixo vende mais com menos margem. Uma posição melhor na liga e uma torcida maior vendem mais.</p>","<p class=\"sm\">Fondo de solidaridad automático: cada jornada, los clubes en situación <b style=\"color:#ef4444\">Mala</b> reciben una cuota.</p><div class=\"btn-group\">":"<p class=\"sm\">Fundo de solidariedade automático: a cada rodada, os clubes em situação <b style=\"color:#ef4444\">Ruim</b> recebem uma cota.</p><div class=\"btn-group\">","<p class=\"sm\">Juegan los campeones de la Copa Internacional (Sudamérica) y de la Copa Europea, más un representante de cada otro continente, que cambian cada temporada. Cuartos: África, Asia, Oceanía y Centro/Norteamérica. Semifinales: se suman los campeones de Europa y Sudamérica. Si tu club participa: +3 M por jugar la semifinal, +4 M por llegar a la final, +10 M si sos campeón (+2 M si perdés la final).</p><table><tr><th>Continente</th><th>Representante de esta temporada</th></tr>":"<p class=\"sm\">Jogam os campeões da Copa Internacional (América do Sul) e da Copa Europeia, mais um representante de cada outro continente, que mudam a cada temporada. Quartas: África, Ásia, Oceania e América Central/do Norte. Semifinais: entram os campeões da Europa e da América do Sul. Se seu clube participar: +3 M por jogar a semifinal, +4 M por chegar à final, +10 M se for campeão (+2 M se perder a final).</p><table><tr><th>Continente</th><th>Representante desta temporada</th></tr>","<p class=\"sm\">Jóvenes promesas en formación. Nuevo juvenil cada ":"<p class=\"sm\">Jovens promessas em formação. Novo jogador da base a cada ","<p class=\"sm\">La aprobación de cada club se actualiza <b>todas las jornadas</b> y tiende hacia un valor que depende de: (1) cuánto recibe respecto de lo esperado para su categoría, (2) su salud económica (Malo −6, Riesgoso −2, Saludable +1, Excelente +3), (3) los asuntos que resolvés (ayudas, reclamos, sedes, giras), (4) objetivos de la selección, (5) premios de Copa, streaming exclusivo (pequeños −5), caja en rojo y cuotas impagas. Cada decisión puntual mueve la aprobación al instante a la mitad de su efecto y el resto llega de a poco.</p>":"<p class=\"sm\">A aprovação de cada clube é atualizada <b>a cada rodada</b> e tende a um valor que depende de: (1) quanto recebe em relação ao esperado para sua categoria, (2) sua saúde financeira (Ruim −6, Arriscada −2, Saudável +1, Excelente +3), (3) os assuntos que você resolve (ajudas, reclamações, sedes, excursões), (4) objetivos da seleção, (5) prêmios de Copa, streaming exclusivo (pequenos −5), caixa no vermelho e cotas não pagas. Cada decisão pontual move a aprovação na hora pela metade do efeito e o resto chega aos poucos.</p>","<p class=\"sm\">La calidad (40 a 88) funciona igual que la de los entrenadores: <b>80 o más</b> entrega en 1 jornada · <b>65 a 79</b> en 2 · <b>52 a 64</b> en 3 · <b>menos de 52</b> en 4. Y encuentra de 2 jugadores (calidad 40) a 8 (calidad 88).</p>":"<p class=\"sm\">A qualidade (40 a 88) funciona igual à dos treinadores: <b>80 ou mais</b> entrega em 1 rodada · <b>65 a 79</b> em 2 · <b>52 a 64</b> em 3 · <b>menos de 52</b> em 4. E encontra de 2 jogadores (qualidade 40) a 8 (qualidade 88).</p>","<p class=\"sm\">La liga sigue en segundo plano. Tu club (":"<p class=\"sm\">A liga continua em segundo plano. Seu clube (","<p class=\"sm\">La selección juega las eliminatorias en el estadio sede: cuanto mejor es, más taquilla y más alquiler cobra el club. Para que más clubes puedan ser sede, subsidiá obras (la Asociación paga la mitad, el club la otra mitad) y ganás aprobación. El <b>Plan de estadios</b> lo hace solo cada 5 jornadas con hasta 2 clubes (los más ricos con estadio mejorable).</p><div class=\"btn-group\">":"<p class=\"sm\">A seleção joga as eliminatórias no estádio-sede: quanto melhor ele for, mais bilheteria e mais aluguel o clube recebe. Para que mais clubes possam ser sede, subsidie obras (a Federação paga metade, o clube a outra metade) e você ganha aprovação. O <b>Plano de estádios</b> faz isso sozinho a cada 5 rodadas com até 2 clubes (os mais ricos com estádio ampliável).</p><div class=\"btn-group\">","<p class=\"sm\">Los compromisos condicionales dependen de que avances de ronda o clasifiques. Importancia: Máxima (semifinales, finales e Intercontinental) · Alta (eliminación directa) · Media (liga y Supercopa).</p>":"<p class=\"sm\">Os compromissos condicionais dependem de você avançar de fase ou se classificar. Importância: Máxima (semifinais, finais e Intercontinental) · Alta (mata-mata) · Média (liga e Supercopa).</p>","<p class=\"sm\">Los premios a los clubes por ronda ganada y por la Supercopa los paga la Asociación. Ingresás derechos y taquilla por cada ronda (más en semifinales y final). Una política generosa cuesta más pero mejora la aprobación; una austera la reduce.</p><div class=\"btn-group\">":"<p class=\"sm\">Os prêmios aos clubes por fase vencida e pela Supercopa são pagos pela Federação. Você recebe direitos e bilheteria em cada fase (mais nas semifinais e na final). Uma política generosa custa mais, mas melhora a aprovação; uma austera a reduz.</p><div class=\"btn-group\">","<p class=\"sm\">Mandato: te queda una temporada más.</p><button class=\"big\" onclick=\"presCont()\">Continuar como Presidente</button> <button onclick=\"presDecline()\">Renunciar al cargo (volver a dirigir)</button>":"<p class=\"sm\">Mandato: resta mais uma temporada.</p><button class=\"big\" onclick=\"presCont()\">Continuar como Presidente</button> <button onclick=\"presDecline()\">Renunciar ao cargo (voltar a treinar)</button>","<p class=\"sm\">Nivel actual: <b>":"<p class=\"sm\">Nível atual: <b>","<p class=\"sm\">Nivel máximo.</p>":"<p class=\"sm\">Nível máximo.</p>","<p class=\"sm\">No tenés suplentes disponibles de ":"<p class=\"sm\">Você não tem reservas disponíveis de ","<p class=\"sm\">No tenés suplentes disponibles en esa línea: el lugar lo ocupa un jugador de otra posición, con penalización.</p>":"<p class=\"sm\">Você não tem function getAvatarSVG(name, pos) {

  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);

  const hairColors = ['#090806', '#2c222b', '#716355', '#b89778', '#a56b46', '#8d4a43'];
  const shirtColors = { POR: '#d97706', DEF: '#2563eb', MED: '#059669', DEL: '#dc2626' };
  
  const skin = skinColors[Math.abs(hash) % skinColors.length];
  const hair = hairColors[Math.abs(hash >> 2) % hairColors.length];
  const shirt = shirtColors[pos] || '#3b82f6';
  
  return `<svg class="avatar" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="50" fill="#1e293b"/>
    <path d="M 30 90 Q 50 75 70 90 L 80 100 L 20 100 Z" fill="${shirt}" />
    <circle cx="50" cy="45" r="22" fill="${skin}" />
    <path d="M 30 40 Q 50 15 70 40 Q 50 30 30 40 Z" fill="${hair}" />
    <circle cx="43" cy="45" r="2.5" fill="#000"/>
    <circle cx="57" cy="45" r="2.5" fill="#000"/>
    <path d="M 44 57 Q 50 62 56 57" stroke="#000" stroke-width="2" fill="none"/>
  </svg>`;
}

POS.forEach((p,i)=>{const hole=(t.hole&&t.hole[p])||0,nd=Math.max(0,f[i]-hole),line=left.filter(x=>x.p==p),fx=FORMX[t.form];
if(p=='MED'&&fx){let mo=fx.mo,md=fx.md;const co=Math.min(hole,mo);mo-=co;md-=Math.min(hole-co,md);const sel=man?line.filter(x=>man.includes(x.n)):[],taken=[];

  [['MD',md-cd.length],['MO',mo-cm.length]].forEach(([slot,need])=>{for(let k=0;k<need;k++){const alt=left.filter(x=>x.p=='MED'),pool=(man?alt.filter(x=>man.includes(x.n)):[]).concat(alt),x=pool[0];

function getTopTwo(country,n=2){
  const countryTeams = G.teams.map((t,i)=>({t,i})).filter(x=>x.t.country===country && x.t.div===1);
  if(countryTeams.length<2)return[];
  if(!G.hist || G.hist.length===0){
    countryTeams.sort((a,b)=>ovr(b.t)-ovr(a.t));
    return countryTeams.slice(0,n).map(x=>x.i);
  }
  const lastHist = G.hist[G.hist.length-1];
  const sorted = countryTeams.sort((a,b)=>{
    const pa = lastHist.rankings ? lastHist.rankings[a.i] || 99 : 99;
    const pb = lastHist.rankings ? lastHist.rankings[b.i] || 99 : 99;
    return pa - pb;
  });
  return sorted.slice(0,n).map(x=>x.i);
}

const KITB=['Vértice','Andes Sport','Kóndor','Delta Pro','Halcón','Stride','Austral','Ímpetu'];
function genKit(){const b=shuf(KITB).slice(0,3);return[
  {n:b[0],fix:r2(.30+R(0,8)/100),yrs:R(3,4),mer:0,tb:0},
  {n:b[1],fix:r2(.15+R(0,5)/100),yrs:R(2,3),mer:.5,tb:0},

function kitDesc(x){return '+'+f2(x.fix)+_t(' M por jornada')+(x.mer?' · '+_t('+50% del merchandising de la selección'):'')+(x.tb?' · '+_t('bono de ')+x.tb+_t(' M por cada título de la selección'):'')+' · '+x.yrs+(x.yrs>1?_t(' temporadas'):_t(' temporada'))}
function pkitNeg(i){const P=G.pres,o=P.kito&&P.kito[i];if(!o)return;if(o.neg){G.msg=_t('Ya negociaste con ')+o.n+'.';render();return}
  if(Math.random()<.55){o.fix=r2(o.fix*1.15);if(o.tb)o.tb=Math.round(o.tb*1.15);o.neg=1;G.msg='🤝 '+o.n+_t(' aceptó mejorar su oferta un 15%.')}
  else{P.kito.splice(i,1);G.msg='❌ '+o.n+_t(' no aceptó tu contrapropuesta y retiró su oferta.')}render()}
function pkit(i){const P=G.pres,o=P.kito&&P.kito[i];if(!o)return;P.kit=Object.assign({},o,{left:o.yrs});P.kito=null;G.msg='👕 '+_t('Firmaste con ')+o.n+_t(' como marca deportiva de la selección.');render()}

function kitUI(){const P=G.pres;if(!P.kit&&!P.kito)P.kito=genKit();

// ===== Equilibrio de las copas continentales =====
// Los clubes "de relleno" de Sudamérica (Uruguay, Paraguay, Ecuador, Chile, Perú) quedan por debajo de los grandes
// de Argentina, Brasil y Colombia, con una jerarquía parecida a la real. Se reajustan al crear la partida y cada temporada.
const FBT={URU:[66,69],PAR:[64,67],ECU:[63,66],CHI:[62,65],PER:[61,64],COL:[63,66]};
function forBal(){(G.foreign||[]).forEach(t=>{const g=FBT[t.c];if(!g||!t.sq)return;if(t.tg==null)t.tg=R(g[0],g[1]);const d=t.tg-ovr(t);if(d)t.sq.forEach(p=>{p.r=Math.max(40,Math.min(92,p.r+d))})});G.fb=1}

let CUPB=null;
function cupSupBon(ids){const P=G.pres;if(!P)return null;const b=(P.hr?2:0)+(P.fl?2:0);if(!b)return null;const m=new Map();
  ids.forEach(x=>{const i=nid(x);if(typeof i==='number'&&G.teams[i]&&G.teams[i].country===P.country)m.set(G.teams[i],b)});return m.size?m:null}
function cupSupPre(K){CUPB=null;const P=G.pres,c=G[K];if(!P||!c||!c.alive)return;
  const mine=c.alive.map(nid).filter(i=>typeof i==='number'&&G.teams[i]&&G.teams[i].country===P.country);if(!mine.length)return;
  const d1=pclubs().filter(i=>G.teams[i].div==1&&!mine.includes(i));
  if((K==='cup'||K==='ecup')&&c.r===0&&P.fsup>0){if(!P.paidF)P.paidF={};if(P.paidF[K]!==G.s){const tot=P.fsup*mine.length;
      if(P.fund>=tot){P.paidF[K]=G.s;pmov(_t('Fondo de apoyo a los clubes en la copa'),-tot);
        mine.forEach(i=>{const t=G.teams[i];t.bud=r2((t.bud||0)+P.fsup);t.sq.slice().sort((a,b)=>b.r-a.r).slice(0,2).forEach(p=>{p.r=Math.min(92,p.r+P.fsup)});apd(i,2)});d1.forEach(i=>apd(i,-1))}}}
  if(P.fl)d1.forEach(i=>apd(i,-1));
  CUPB=cupSupBon(c.alive)}

// alWatch revisa hechos importantes (títulos, sede del Mundial, ascensos) y los encola una sola vez por manager.
function alPush(k,ic,ti,tx){if(!G.alq)G.alq={};(G.alq[k]=G.alq[k]||[]).push({ic,ti,tx})}
function alWatch(silent){if(!G||!G.pl||!G.pl.length||G.me==null||G.cur==null||G.live)return;if(!G.seen){G.seen={};const c0=G.cur,m0=G.me;G.pl.forEach((ci,kk)=>{G.cur=kk;G.me=ci;alWatch(true)});G.cur=c0;G.me=m0;return}
  const k=G.cur,S=G.seen,see=(key,f)=>{const kk=k+':'+key;if(S[kk])return;S[kk]=1;if(!silent)f()};
  const pres=isPres(),P=G.pres,cix=x=>typeof x==='string'&&x[0]==='L'?+x.slice(1):(typeof x==='number'?x:-1);
  const mine=i=>i>=0&&G.teams[i]&&(pres?G.teams[i].country===P.country:i===G.me);
  [['cup',_t('Copa Internacional')],['ecup',_t('Copa Europea')],['ic',_t('Copa Intercontinental')]].forEach(([K,nm])=>{const c=G[K];if(!c||c.champ==null)return;const i=cix(c.champ);if(!mine(i))return;
    see(K+'-'+G.s,()=>alPush(k,'🏆',pres?_t('¡Un club de tu liga es campeón!'):_t('¡Campeones!'),(pres?G.teams[i].n+_t(' ganó la '):_t('Tu club ganó la '))+nm+'.'))});
  if(!pres){const t=G.teams[G.me],n=G.nc&&G.nc[t.country];if(n&&n.champ===G.me)see('nc-'+G.s,()=>alPush(k,'🏆',_t('¡Campeones!'),_t('Tu club ganó la Copa Nacional.')));
    if(seasonOver()){const tb=table(t.country,t.div),pos=tb.findIndex(r=>r.i===G.me)+1;
      if(pos===1)see('lg-'+G.s,()=>alPush(k,'🏆',_t('¡Campeones de liga!'),_t('Tu club terminó primero en ')+_t(DN[t.div-1])+'.'));
      if((t.div==2&&pos>0&&pos<=3)||(t.div==3&&pos===1))see('up-'+G.s,()=>alPush(k,'⬆️',_t('¡Ascenso!'),_t('Tu club juega la próxima temporada en ')+_t(DN[t.div-2])+'.'))}}
  if(pres){const N=G.nt;if(N&&N.hist)N.hist.slice(-2).forEach(h=>{if(h.s===G.s&&h.champ===P.country)see('nt-'+G.s+'-'+h.t,()=>alPush(k,'🌍',_t('¡Tu selección es campeona!'),_t(CNM[P.country])+_t(' ganó la ')+_t(NTN[h.t==='cc'&&CONT[P.country]==='EUR'?'eu':h.t])+'.'))});
    if(G.wch&&G.wch.c===P.country)see('wch-'+G.wch.s,()=>alPush(k,'🌐',_t('¡Tu país será sede del Mundial!'),_t('La Federación Mundial eligió a ')+_t(CNM[P.country])+_t(' como sede de la Copa del Mundo de la temporada ')+G.wch.s+'.'))}}

    +' · '+_t('Nivel del equipo: ')+c.o0+' → <b>'+c.o1+'</b>'+(c.o1>c.o0?' ❌ '+_t('no puede subir.'):'');
  if(b)b.disabled=!c.ok}
function nmSave(){if(G.live){G.msg=_t('No se pueden editar nombres durante un partido: terminá el partido y volvé.');render();return}
  const t=G.teams[VN],L=nmList(t),errs=[];let n=0;const chk=nmCheck();
  if(!chk.ok){G.msg='❌ '+_t('Revisá la edad y la calidad: el reparto de puntos no está equilibrado o el nivel del equipo subiría.');render();return}
  chk.rd.forEach(x=>{if(x.p.age!==x.age||x.p.r!==x.r){x.p.age=x.age;x.p.r=x.r;n++}});
  const cn=nmClean((document.getElementById('nmclub')||{}).value);
  if(cn&&cn!==t.n){const e=nmErr(cn)||renameClub(VN,cn);if(e)errs.push(nmEsc(cn)+': '+e);else n++}
  const want=L.map((p,i)=>{const el=document.getElementById('nmp_'+i);return el?nmClean(el.value):p.n});
  const dup=want.find((x,i)=>want.indexOf(x)!==i);if(dup){G.msg='❌ '+_t('Hay nombres repetidos en el plantel: ')+nmEsc(dup);render();return}
  // primero nombres temporales para permitir intercambios entre dos jugadores
  const ch=L.map((p,i)=>want[i]!==p.n?i:-1).filter(i=>i>=0);
  for(const i of ch){const e=nmErr(want[i]);if(e){errs.push(nmEsc(want[i])+': '+e);continue}}
  if(!errs.length){ch.forEach(i=>{renamePlayer(VN,L[i],'\u0000tmp'+i)});ch.forEach(i=>{const p=L[i],o=p.n0;renamePlayer(VN,p,want[i]);if(o&&o.indexOf('\u0000')!==0)p.n0=o;if(p.n0===p.n)delete p.n0;n++})}
  G.msg=errs.length?'❌ '+errs.join(' · '):(n?'✏️ '+_t('Cambios guardados: ')+n+'.':_t('No había cambios para guardar.'));render()}
function nmReset(ti){const t=G.teams[ti];if(t.n0)renameClub(ti,t.n0);const L=nmList(t);L.forEach((p,i)=>{if(p.n0)renamePlayer(ti,p,'\u0000tmp'+i)});L.forEach(p=>{if(p.n0&&p.n.indexOf('\u0000')===0){const o=p.n0;renamePlayer(ti,p,o);delete p.n0}});
  G.msg='↩️ '+_t('Se restauraron los nombres originales de ')+t.n+'.';render()}
function nmResetAll(){G.teams.forEach((t,i)=>{if(t.n0||nmList(t).some(p=>p.n0))nmReset(i)});G.msg='↩️ '+_t('Se restauraron todos los nombres originales.');render()}
function nmExport(all){const clubs=[];G.teams.forEach((t,i)=>{const L=nmList(t),mod=t.n0||L.some(p=>p.n0);if(!all&&!mod)return;
    const pl={};POS.forEach(q=>{pl[q]=t.sq.filter(p=>p.p===q).sort((a,b)=>b.r-a.r).map(p=>({name:p.n,age:p.age,nationality:p.nat}))});clubs.push({original:t.n0||t.n,name:t.n,country:t.country,reputation:t.rep||null,players:pl})});
  if(!clubs.length){G.msg=_t('Todavía no editaste ningún nombre.');render();return}

  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=all?'comanda-nombres-plantilla.json':'comanda-nombres.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}catch(e){}
  G.msg='📦 '+_t('Exportados ')+clubs.length+_t(' clubes. Si la descarga no empezó, copiá el texto del recuadro.');render();const io=document.getElementById('nmio');if(io)io.value=txt}
function nmFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>nmImport(String(r.result||''));r.readAsText(f)}
function nmImport(txt){if(G.live)return;let d;try{d=JSON.parse(txt)}catch(e){G.msg='❌ '+_t('El archivo no es válido.');render();return}
  if(!d||!Array.isArray(d.clubs)){G.msg='❌ '+_t('El archivo no tiene el formato de nombres de Comanda el Fútbol.');render();return}
  let nc=0,np=0,nu=0,skip=0;
  d.clubs.forEach(c=>{if(!c)return;const key=nmClean(c.original),ti=G.teams.findIndex(t=>(t.n0||t.n)===key||t.n===key);if(ti<0){skip++;return}
    const t=G.teams[ti],nn=nmClean(c.name);if(nn&&nn!==t.n&&!nmErr(nn)&&!renameClub(ti,nn))nc++;
    const pl=c.players||{};POS.forEach(q=>{// Cada jugador puede venir como texto (solo nombre, formato anterior) o como {name, age, nationality}
      const ents=Array.isArray(pl[q])?pl[q]:[];const ps=t.sq.filter(p=>p.p===q).sort((a,b)=>b.r-a.r);
      ps.forEach((p,k)=>{const e=ents[k];if(e==null)return;const o=typeof e==='string'?{name:e}:(typeof e==='object'?e:{});
        const ag=Math.round(+o.age),na=String(o.nationality||'').trim().toUpperCase();let ch=false;
        if(ag>=16&&ag<=42&&ag!==p.age){p.age=ag;ch=true}
        if(/^[A-Z]{3}$/.test(na)&&na!==p.nat){p.nat=na;ch=true}
        if(ch)nu++;
        const n2=nmClean(o.name);if(!n2||n2===p.n||nmErr(n2))return;if(!renamePlayer(ti,p,n2))np++})})});
  G.msg='📦 '+_t('Importación terminada: ')+nc+_t(' clubes y ')+np+_t(' jugadores renombrados')+(nu?_t('; jugadores con edad o nacionalidad actualizadas: ')+nu:'')+(skip?_t('; clubes no encontrados: ')+skip:'')+'.';render()}
// ===== Contratos de jugadores (sistema simple: solo duración; los sueldos siguen con el cálculo global) =====
// p.ct = temporadas de contrato que le quedan (contando la actual). Al terminar la temporada baja 1; si llega a 0, queda libre.
// p.mh = tiempos jugados en la temporada (cada partido son 2); t.mh = tiempos que jugó su club.
const ctNew=p=>p.age<=23?4:p.age<=27?3:p.age<=31?2:1;            // duración al fichar o comprar
const ctSign=p=>{p.ct=ctNew(p);delete p.xc;delete p.fa;return p};
const ctTxt=p=>p.ct==null?'—':p.ct<=1?_t('⚠️ último año'):p.ct+_t(' temporadas');
// Disposición del jugador a renovar por 'y' temporadas: minutos jugados, si se siente por encima de su club
// (y la chance de que lo quiera uno mejor), su edad y su personalidad.
function rnScore(p,t,y){if(p.rz==null)p.rz=Math.round((Math.random()*.2-.1)*100)/100;
  const pl=(t.mh||0)>=6?Math.min(1,(p.mh||0)/t.mh):.5,gap=p.r-ovr(t),up=gap>0;
  let s=.55+(pl-.5)*.6-Math.max(0,gap)/12*.35-(up?(t.div==3?.25:t.div==2?.15:EUL(t.country)?0:.05)+(SAMC(t)?.08:0):0);
  if(p.age>=30)s+=.06*(y-1);else if(up&&p.age<=26)s-=.07*(y-1);else s+=.02*(y-1);
  return s+p.rz}
const rnLbl=v=>v>=.6?_t('<b style="color:var(--success)">Alta</b>'):v>=.5?_t('<b style="color:var(--accent-gold)">Media</b>'):_t('<b style="color:var(--danger)">Baja</b>');
function myCtP(){const t=G.teams[G.me],own=t.sq.map(p=>({p,t,away:null})),lo=[];G.teams.forEach((T,i)=>{if(i!=G.me)T.sq.forEach(p=>{if(p.originalOwner===G.me)lo.push({p,t,away:T})})});return own.concat(lo)}
function renew(n){const t=G.teams[G.me],e=myCtP().find(x=>x.p.n===n);if(!e)return;const p=e.p,el=document.getElementById('rny_'+n.replace(/\W/g,'_')),y=Math.max(1,Math.min(4,parseInt(el&&el.value)||2));
  if(p.ct>1){G.msg=p.n+_t(' todavía tiene ')+p.ct+_t(' temporadas de contrato: se renueva en su último año.');render();return}
  if(rnScore(p,t,y)>=.5){p.ct=1+y;G.msg='✍️ '+p.n+_t(' renovó por ')+y+(y>1?_t(' temporadas'):_t(' temporada'))+_t(' más.')}
  else G.msg='❌ '+p.n+_t(' no acepta renovar por ')+y+(y>1?_t(' temporadas'):_t(' temporada'))+_t('. Probá con otra duración o dale más minutos.');render()}
function ctUI(){const L=myCtP().filter(x=>x.p.ct!=null&&x.p.ct<=1);if(!L.length)return '';
  return win(_t('📄 Renovaciones de contrato (')+L.length+')',_t('<p class="sm">Estos jugadores terminan su contrato al final de la temporada: si no renuevan, se van libres. Cada uno decide según los minutos que juega, si se siente por encima del club y la duración que le ofrecés (los veteranos prefieren contratos largos; los jóvenes que se creen mejores que su club, cortos).</p><div class="sc"><table><tr><th>Pos</th><th>Jugador</th><th>Edad</th><th>Nivel</th><th>Minutos</th><th>Disposición</th><th>Renovar por</th><th></th></tr>')+L.map(({p,t,away})=>{const id='rny_'+p.n.replace(/\W/g,'_'),best=Math.max(...[1,2,3,4].map(y=>rnScore(p,t,y))),pl=(t.mh||0)>=6?Math.round(Math.min(1,(p.mh||0)/t.mh)*100)+'%':'—';
    return '<tr><td><span class="badge badge-'+p.p.toLowerCase()+'">'+PLB(p)+'</span></td><td>'+p.n+(away?_t(' <span class="sm">(cedido en ')+away.n+')</span>':'')+'</td><td>'+p.age+'</td><td><b>'+p.r+'</b></td><td>'+(away?'—':pl)+'</td><td>'+rnLbl(best)+'</td><td><select id="'+id+'">'+[1,2,3,4].map(y=>'<option value="'+y+'"'+(y==2?' selected':'')+'>'+y+(y>1?_t(' temporadas'):_t(' temporada'))+'</option>').join('')+'</select></td><td><button onclick="renew(\''+p.n.replace(/'/g,"\\'")+_t('\')">Ofrecer</button></td></tr>')}).join('')+'</table></div>')}
// Fin de temporada: vencen los contratos. Los clubes de la IA renuevan a quien les sirve (si el jugador acepta);
// los que se van quedan libres: los del manager siempre llegan al Mercado; de la IA, solo los mejores (el resto se va a otras ligas).
function ctEnd(reps){const pool=[],ai=[];
  G.teams.forEach((t,ti)=>{const hk=G.pl.indexOf(ti),hum=isHum(ti);
    t.sq.slice().forEach(p=>{if(p.ct==null)p.ct=R(1,4);p.ct--;if(p.ct>0)return;
      if(!hum){const want=(p.r>=ovr(t)-4&&p.age<=32)||p.r>=ovr(t)+2,y=ctNew(p);if(want&&rnScore(p,t,y)>=.5){p.ct=y;return}}
      t.sq.splice(t.sq.indexOf(p),1);if(t.lu)t.lu=t.lu.filter(x=>x!==p.n);p.xc=true;p.fa=true;p.disc=.35;p.boughtThisSeason=false;p.originalOwner=null;
      if(hum){pool.push(p);if(hk>=0)reps[hk].push('📄 '+p.n+' ('+p.p+', '+p.r+_t(') terminó su contrato y se fue libre.'))}else ai.push(p)})});
  // un manager nunca queda con menos de 14: sube juveniles de la cantera
  G.pl.forEach((ci,k)=>{const t=G.teams[ci];if(!isHum(ci))return;while(t.sq.length<MINSQ){const p=POS.map(q=>[q,AIBASE[q]-t.sq.filter(x=>x.p==q).length]).sort((a,b)=>b[1]-a[1])[0][0],y=mkP(p,52,natOf(t),t.sq.concat(t.acad||[]));y.age=R(17,19);y.r=R(44,58);y.ct=3;t.sq.push(y);reps[k].push(_t('Para completar el plantel subió de la cantera ')+y.n+' ('+y.p+', '+y.r+').')}});
  G.teams.forEach(t=>{t.mh=0;t.sq.forEach(p=>{p.mh=0})});
  return pool.concat(ai.sort((a,b)=>b.r-a.r).slice(0,30))}
// ===== Sudamérica, semillero de Europa =====
const vct=p=>val(p)*(p.ct==1?.75:p.ct==2?.9:1);
const SAMC=t=>!!t&&CONT[t.country]=='SAM',EURC=t=>!!t&&CONT[t.country]=='EUR';
function sellErr(S,p){if(S.sq.length<=MINSQ)return S.n+_t(' se quedaría con menos de ')+MINSQ+_t(' jugadores.');if(S.sq.filter(x=>x.p==p.p).length<=MIN[p.p])return S.n+_t(' se quedaría sin ')+p.p+_t(' suficientes.');return''}
function tfeed(t){G.tf=[t].concat(G.tf||[]).slice(0,12)}
function aiEcon(){G.teams.forEach((t,i)=>{if(!isHum(i))t.bud=Math.round(((t.bud==null?R(12,35):t.bud)+(t.div==3?.15:t.div==2?.3:.6))*10)/10});aiFill()}
// Los clubes de la IA no bajan de AIMIN jugadores ni de 11 disponibles: si les falta gente, suben juveniles a la línea más corta.
const AIMIN=16,AIBASE={POR:2,DEF:5,MED:5,DEL:4};
function aiFill(){G.teams.forEach((t,i)=>{if(isHum(i)||!t.sq)return;const avl=()=>t.sq.filter(x=>!(x.i>0||x.s>0||x.cv>0)).length;while(t.sq.length<AIMIN||(avl()<11&&t.sq.length<MAXSQ)){
  const p=POS.map(q=>[q,AIBASE[q]-t.sq.filter(x=>x.p==q).length]).sort((a,b)=>b[1]-a[1])[0][0],lv=ovr(t);
  const fa=(G.mk||[]).filter(x=>x.xc&&x.p==p&&x.r>=lv-12&&x.r<=lv+4&&!cupoErr(i,x)&&mprice(x)<=(t.bud||0)).sort((a,b)=>b.r-a.r)[0];
  if(fa){G.mk.splice(G.mk.indexOf(fa),1);t.bud=Math.round(((t.bud||0)-mprice(fa))*10)/10;delete fa.disc;ctSign(fa);fa.boughtThisSeason=true;t.sq.push(fa);tfeed(t.n+' ['+t.country+_t('] fichó al agente libre ')+fa.n+' ('+_t(fa.p)+' '+fa.r+')');continue}
  const y=mkP(p,52,natOf(t),t.sq.concat(t.acad||[]));y.age=R(17,19);y.r=R(44,58);y.ct=R(2,3);t.sq.push(y)}})}

function aiTransfers(n){
  const ai=G.teams.map((t,i)=>i).filter(i=>!isHum(i));
  ai.forEach(i=>{if(G.teams[i].bud==null)G.teams[i].bud=R(12,35)});
  
  for(let k=0;k<n;k++){
    const bi=pick(ai),B=G.teams[bi];if(B.sq.length>=MAXSQ)continue;let best=null;
    for(let j=0;j<24;j++){
      const sa=EURC(B)&&Math.random()<.35?ai.filter(i=>SAMC(G.teams[i])):null,si=sa&&sa.length?pick(sa):pick(ai);if(si==bi||(G.bc[bi+'>'+si]||0)>=2)continue;const S=G.teams[si],p=pick(S.sq);if(sellErr(S,p)||S.sq.length<=15)continue;
      if(p.boughtThisSeason) continue;
      if(cupoErr(bi,p))continue;
      if(surCnt(B,sn(p.n))>=2)continue;
      const price=Math.round(vct(p)*(EURC(B)&&SAMC(S)?1.3+Math.random()*.2:1.1)*10)/10;if(price>B.bud)continue;if(G.crule&&G.crule.cap&&EURC(B)&&price>25)continue;
      const line=B.sq.filter(x=>x.p==p.p).map(x=>x.r).sort((a,b)=>b-a),need=FORM[B.form][POS.indexOf(p.p)],cut=line[need-1]||40;
      if(p.r<=cut+1)continue;if(!best||p.r>best.p.r)best={si,S,p,price}
    }
    if(best){
      const{si,S,p,price}=best;S.sq.splice(S.sq.indexOf(p),1);p.boughtThisSeason=true;ctSign(p);B.sq.push(p);G.bc[bi+'>'+si]=(G.bc[bi+'>'+si]||0)+1;B.bud=Math.round((B.bud-price)*10)/10;S.bud=Math.round(((S.bud||0)+price*.8)*10)/10;presFee(price,B,S);
      tfeed(B.n+' ['+B.country+_t('] compró a ')+p.n+' ('+_t(p.p)+' '+p.r+_t(') de ')+S.n+' ['+S.country+_t('] por ')+f1(price)+' M')
    }
  }

  G.pl.forEach(humanIdx => {
    const Hs = SAMC(G.teams[humanIdx]), eu = ai.filter(i=>EURC(G.teams[i]));
    if(Math.random() < (Hs ? 0.6 : 0.45)) {
      const buyerIdx = Hs && eu.length && Math.random() < 0.5 ? pick(eu) : pick(ai);
      const prem = Hs && EURC(G.teams[buyerIdx]);
      const B = G.teams[buyerIdx];
      const H = G.teams[humanIdx];
      if(B.sq.length < MAXSQ && H.sq.length > MINSQ) {
        const candidates = H.sq.filter(p => !p.boughtThisSeason && !cupoErr(buyerIdx,p) && !G.offers.some(o => o.from == buyerIdx && o.n == p.n));
        if(candidates.length > 0) {
          const p = pick(candidates);
          const isLoan = Math.random() < (prem ? 0.15 : 0.35);
          if(isLoan) {
            const fee = Math.round(vct(p) * 0.2 * 10) / 10;
            if(B.bud >= fee) {
              G.oid = (G.oid || 0) + 1;
              G.offers.push({ id: G.oid, from: buyerIdx, to: humanIdx, n: p.n, price: fee, type: 'loan' });
              notify(humanIdx, '📨 ' + B.n + ' ['+B.country+_t('] quiere la CESIÓN de ') + p.n + _t(' por ') + f1(fee) + ' M.');
            }
          } else {
            const price = Math.round(vct(p) * (prem ? 1.3 + Math.random() * 0.2 : 1.1 + Math.random() * 0.2) * 10) / 10;
            if(B.bud >= price) {
              G.oid = (G.oid || 0) + 1;
              G.offers.push({ id: G.oid, from: buyerIdx, to: humanIdx, n: p.n, price: price, type: 'buy' });
              notify(humanIdx, '📨 ' + B.n + ' ['+B.country+_t('] ofertó ') + f1(price) + _t(' M para COMPRAR a ') + p.n + '.');
            }
          }
        }
      }
    }
  });
}

function offer(ci,pi,prOv,tyOv){
  const t=G.teams[ci],p=t.sq[pi],el=document.getElementById('ofr'+pi),typeEl=document.getElementById('ofrtype'+pi),price=prOv!=null?Math.round(prOv*10)/10:Math.round(parseFloat(el&&el.value)*10)/10,type=tyOv||(typeEl?typeEl.value:'buy'),key=G.me+'>'+ci,B=G.teams[G.me];
  const bad=m=>{G.msg=m;render()};
  if(!trOpen())return bad(trMsg());
  if(!(price>0))return bad(_t('Poné un precio válido.'));
  if(price>G.bud)return bad(_t('No te alcanza el presupuesto para esa oferta.'));
  if(B.sq.length>=MAXSQ)return bad(_t('Tu plantilla está llena (máx. ')+MAXSQ+').');
  if((G.bc[key]||0)>=2)return bad(_t('Ya realizaste 2 operaciones con este club esta temporada.'));
  if(p.boughtThisSeason) return bad(_t('Este jugador fue transferido o cedido recientemente y no se puede mover de nuevo esta temporada.'));
  if(cupoErr(G.me,p))return bad(cupoErr(G.me,p));

  if(!G.pl.includes(ci)){
    const rk=key+'|'+p.n+'|'+type;
    if(G.rej.includes(rk))return bad(_t('Ya rechazaron tu oferta por ')+p.n+_t(': probá de nuevo la próxima jornada.'));
    const e=sellErr(t,p);if(e)return bad(e);

    const minPrice = type === 'loan' ? vct(p) * 0.18 : vct(p) * 1.05;
    if(price < minPrice * (1 + Math.random() * 0.2)){
      G.rej.push(rk);
      return bad(t.n+_t(' rechazó tu oferta de ')+(type==='loan'?_t('cesión'):'compra')+_t(' por ')+p.n+_t('. Esperaban más.'));
    }

    t.sq.splice(pi,1);
    p.boughtThisSeason = true;
    if(type === 'loan') {
      p.originalOwner = ci;
    } else ctSign(p);
    B.sq.push(p);
    G.bc[key]=(G.bc[key]||0)+1;
    t.bud=Math.round(((t.bud||0)+price*.8)*10)/10;presFee(price,B,t);
    G.bud=Math.round((G.bud-price)*10)/10;
    tfeed(B.n+' ['+B.country+']'+(type==='loan'?_t(' obtuvo la cesión de '):_t(' compró a '))+p.n+' ('+_t(p.p)+' '+p.r+_t(') de ')+t.n+' ['+t.country+_t('] por ')+f1(price)+' M');
    return bad('✅ '+t.n+_t(' aceptó: ')+p.n+_t(' llegó ')+(type==='loan'?_t('cedido'):_t('en propiedad'))+_t(' por ')+f1(price)+' M.');
  }

  G.offers=G.offers.filter(o=>!(o.from==G.me&&o.to==ci&&o.n==p.n));G.oid=(G.oid||0)+1;
  G.offers.push({id:G.oid,from:G.me,to:ci,n:p.n,price,type});
  notify(ci,'📨 '+B.n+' ['+B.country+_t('] ofreció ')+(type==='loan'?_t('CESIÓN'):_t('COMPRA'))+_t(' de ')+f1(price)+_t(' M por ')+p.n+_t('. Respondé en Mercado.'));
  G.msg=_t('Oferta enviada a ')+t.n+_t(' por ')+p.n+'.';render();
}

function respond(id,acc){
  const i=G.offers.findIndex(o=>o.id==id);if(i<0)return;
  const o=G.offers[i],S=G.teams[o.to],B=G.teams[o.from],pi=S.sq.findIndex(x=>x.n==o.n),p=S.sq[pi];
  const isLoan = o.type === 'loan';

  if(!acc){
    G.offers.splice(i,1);
    if(G.me==o.to && G.pl.includes(o.from)) notify(o.from,'❌ '+S.n+_t(' rechazó tu oferta por ')+o.n+'.');
    G.msg=_t('Oferta ')+(G.me==o.to?_t('rechazada'):_t('cancelada'))+'.';render();return;
  }

  if(G.me!=o.to)return;
  let err='';
  if(!trOpen())err=trMsg();
  else if(!p)err=_t('El jugador ya no está en el club.');
  else if(p.boughtThisSeason)err=_t('Un jugador transferido/cedido esta temporada no puede volver a cambiar de club.');
  else if(S.sq.length<=14)err=_t('Te quedarías con menos de 14 jugadores.');
  else if(S.sq.filter(x=>x.p==p.p).length<=MIN[p.p])err=_t('Te quedarías sin ')+p.p+_t(' suficientes.');
  else if(B.sq.length>=MAXSQ)err=_t('El club comprador tiene la plantilla llena.');
  else if(cupoErr(o.from,p))err=_t('El club comprador no tiene cupo de extranjeros disponible (máx. ')+MAXFOR+').';
  else if(B.bud<o.price)err=_t('El comprador ya no tiene presupuesto.');
  else if((G.bc[o.from+'>'+o.to]||0)>=2)err=_t('El comprador ya realizó 2 operaciones con tu club esta temporada.');

  if(err){G.msg=err;render();return}

  S.sq.splice(pi,1);
  if(S.lu)S.lu=S.lu.filter(x=>x!=p.n);
  
  p.boughtThisSeason = true;
  if(isLoan) {
    p.originalOwner = o.to;
  } else ctSign(p);
  
  B.sq.push(p);
  G.bc[o.from+'>'+o.to]=(G.bc[o.from+'>'+o.to]||0)+1;
  S.bud=Math.round((S.bud+o.price)*10)/10;
  B.bud=Math.round((B.bud-o.price)*10)/10;presFee(o.price,B,S);
  G.offers.splice(i,1);

  if(G.pl.includes(o.from)) notify(o.from,'✅ '+S.n+_t(' aceptó tu oferta: ')+p.n+_t(' llegó ')+(isLoan?_t('cedido'):_t('en propiedad'))+_t(' por ')+f1(o.price)+' M.');
  G.msg=(isLoan?_t('Cediste'):_t('Vendiste'))+_t(' a ','persona')+p.n+_t(' por ')+f1(o.price)+' M.';render();
}

  const C=scorer?(X.find(x=>x.n===scorer)||{n:scorer,p:'DEL'}):rlPick(X,fwd),A=rlPick(X.filter(x=>x!==C),x=>def(x)||mid(x)),B=rlPick(X.filter(x=>x!==C&&x!==A),x=>fwd(x)||mid(x));
  const K=Y.find(x=>x.p==='POR'),D=rlPick(Y,def);const v={T,R:Rv,A:rlName(A),B:rlName(B),C:rlName(C),K:rlName(K)||Rv,D:rlName(D)||Rv,lado:rlP('lado'),dest:rlP('dest'),dir:rlP('dir')};

  else if(kind==='cross'){say('start');say('pass');say('recv');say('cross');say('head')}
  else if(kind==='long'){say('start');say('shot')}
  else if(kind==='rebound'){say('start');say('recv');say('shot');say('rebound')}

// construye las líneas de la mitad n desde el minuto m0 hasta el final o hasta la primera pausa del equipo humano
function rlBuild(n,m0){const L=G.live,end=n==1?45:90,h=L.h,a=L.a,ci=L.ci,items=[];
  const inWin=x=>x.min>m0&&x.min<=end&&(n==1?x.min<=45:x.min>45);
  L.ev.filter(inWin).forEach(e=>items.push({min:e.min,k:'goal',e}));
  L.cards.filter(c=>c.half==n&&inWin(c)).forEach(c=>items.push({min:c.min,k:'card',c}));
  if(n==1)(L.inj||[]).filter(inWin).forEach(o=>items.push({min:o.min,k:'inj',o}));
  // pausa: primera expulsión o lesión del equipo humano en la ventana
  const stops=items.filter(x=>(x.k==='card'&&x.c.ti==ci&&x.c.red)||(x.k==='inj'&&x.o.ti==ci)).sort((p,q)=>p.min-q.min);
  const stopAt=stops.length?stops[0].min:null,lim=stopAt||end;
  const Hs=str(TT(h),0),As=str(TT(a),0),wH=Math.max(.2,Math.exp((Hs.atk-As.def)/30)),wA=Math.max(.2,Math.exp((As.atk-Hs.def)/30)*.85);
  const span=lim-m0,nCh=Math.max(1,Math.round((R(4,7)+(n==2?1:0))*span/45)),nNe=Math.max(0,Math.round(R(2,4)*span/45));
  const usedM=new Set(items.map(x=>x.min)),freeMin=()=>{for(let t=0;t<12;t++){const mm=R(m0+1,lim);if(!usedM.has(mm)){usedM.add(mm);return mm}}return R(m0+1,lim)};
  for(let i=0;i<nCh;i++){const side=Math.random()<wH/(wH+wA)?h:a,res=Math.random()<.012?'pensave':pick(['save','save','miss','miss','block','off','save','miss']);items.push({min:freeMin(),k:'ch',side,res})}
  for(let i=0;i<nNe;i++)items.push({min:freeMin(),k:'ne',side:Math.random()<.5?h:a});
  if(n==2&&m0<85&&lim>=86)items.push({min:R(86,88),k:'late'});
  const list=items.filter(x=>x.min<=lim).sort((p,q)=>p.min-q.min||(p.k==='goal'?1:0)-(q.k==='goal'?1:0));
  // marcador al empezar la ventana
  let gh=L.ev.filter(e=>e.min<=m0&&e.side=='h').length,ga=L.ev.filter(e=>e.min<=m0&&e.side=='a').length;
  const goalsBy={};L.ev.filter(e=>e.min<=m0).forEach(e=>goalsBy[e.n]=(goalsBy[e.n]||0)+1);
  const behind={h:false,a:false};{let x=0,y=0;L.ev.filter(e=>e.min<=m0).sort((p,q)=>p.min-q.min).forEach(e=>{if(e.side=='h')x++;else y++;if(x<y)behind.h=true;if(y<x)behind.a=true})}
  const lines=[],sc=()=>TT(h).n+' '+gh+' - '+ga+' '+TT(a).n,push=(min,txt,cls,extra)=>lines.push(Object.assign({min,txt,cls:cls||'',gh,ga},extra||{}));
  if(m0===0&&n==1)push(0,rlFill(rlP('k1'),{T:TT(h).n}),'k');
  if(m0===45&&n==2)push(45,rlP('k2'),'k');
  list.forEach(x=>{
    if(x.k==='goal'){const e=x.e,ti=e.side=='h'?h:a,oi=ti==h?a:h,pre=gh-ga;const P=rlPlay(ti,oi,x.min,n,'goal',e.n);
      P.forEach((t,i)=>{if(i===P.length-1){if(e.side=='h')gh++;else ga++}push(x.min,t,i===P.length-1?'goal':'',Object.assign({side:e.side},i===0?{first:1}:{}))});
      goalsBy[e.n]=(goalsBy[e.n]||0)+1;if(gh<ga)behind.h=true;if(ga<gh)behind.a=true;const d=gh-ga,me=e.side=='h'?d:-d,was=e.side=='h'?pre:-pre,T=TT(ti).n,C=e.n;
      const ck=goalsBy[C]===3?'ctxHat':goalsBy[C]===2?'ctxDouble':me>=4?'ctxRout':was<0&&me===0?'ctxTie':was===0&&me===1&&gh+ga===1?'ctxLead':was===0&&me===1&&behind[e.side]?'ctxTurn':was===0&&me===1?'ctxAhead':was>0?'ctxMore':'ctxCut';
      push(x.min,rlFill(rlP(ck),{T,C})+' '+sc(),'ctx',{side:e.side})}
    else if(x.k==='card'){const c=x.c,t=TT(c.ti),p=t.sq.find(y=>y.n===c.nm),X=p?rlName(Object.assign({},p)):c.nm;
      const sd=c.ti==h?'h':'a';if(!c.red)push(x.min,rlFill(rlP('yellow'),{X}),'card',{first:1,side:sd});
      else{push(x.min,rlFill(rlP(c.dy?'red2':'red'),{X})+(c.mo?' ('+c.mo+')':''),'red',{first:1,side:sd});if(c.ti==ci&&x.min===stopAt)push(x.min,rlP('stop'),'stop',{stop:1})}}
    else if(x.k==='inj'){const o=x.o,t=TT(o.ti),p=t.sq.find(y=>y.n===o.nm);push(x.min,rlFill(rlP('injury'),{X:p?o.nm+' ('+o.p+')':o.nm}),'inj',{first:1,side:o.ti==h?'h':'a'});if(o.ti==ci&&x.min===stopAt)push(x.min,rlP('stop'),'stop',{stop:1})}
    else if(x.k==='ch'){const oi=x.side==h?a:h;rlPlay(x.side,oi,x.min,n,x.res).forEach((t,i)=>push(x.min,t,'',Object.assign({side:x.side==h?'h':'a'},i===0?{first:1}:{})))}
    else if(x.k==='ne'){const X=rlXI(x.side,x.min,n),tp=rlP('neutral');push(x.min,rlFill(tp,{T:TT(x.side).n,R:TT(x.side==h?a:h).n,A:rlName(rlPick(X,()=>true))}),'',/\{(T|R|A)\}/.test(tp)?{first:1,side:x.side==h?'h':'a'}:{first:1})}
    else if(x.k==='late')push(x.min,rlFill(rlP('late'),{T:TT(gh<ga?h:gh>ga?a:h).n}),'',{first:1});
  });
  if(!stopAt){if(n==1)push(45,rlFill(rlP('ht'),{SC:sc()}),'end',{end:1});
    else{push(90,rlFill(rlP('ft'),{SC:sc()}),'end');
      if(gh!==ga)push(90,rlFill(rlP('ftWin'),{T:TT(gh>ga?h:a).n}),'end');
      else if(L.pen){push(90,rlP('pens'),'end');push(90,rlFill(rlP('pensW'),{T:TT(L.pw).n}),'end')}

function mkFx(){

      const ids=G.teams.map((t,i)=>i).filter(i=>G.teams[i].country===country&&G.teams[i].div===d);
      if(ids.length<2)return[];
      const f=fixtures(ids.length).map(r=>r.map(([a,b])=>[ids[a],ids[b]]));
      if(d===3)return Array.from({length:Math.max(30,2*(G.teams.filter(t=>t.country===country&&t.div===1).length-1))},(_,w)=>{const r=f[w%f.length];return Math.floor(w/f.length)%2?r.map(([a,b])=>[b,a]):r});
      return f;
    });
    return divs[0].map((r,w)=>r.concat(divs[1][w]||[],divs[2][w]||[]));
  });

}

function table(country, d){
  const t=G.teams.map((x,i)=>({i,pj:0,gf:0,gc:0,pts:0}));
  G.res.forEach(w=>w.forEach(([h,a,gh,ga])=>{
    const H=t[h],A=t[a];
    H.pj++;A.pj++;H.gf+=gh;H.gc+=ga;A.gf+=ga;A.gc+=gh;
    if(gh>ga)H.pts+=3;else if(gh<ga)A.pts+=3;else{H.pts++;A.pts++}
  }));
  return t.filter(x=>G.teams[x.i].country==country && G.teams[x.i].div==d)
          .sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf);
}

const SAVEF='comanda-el-futbol-partida',SAVEG=ANF?'anf':'cef';let LDP=null;
function sfSlug(x){return String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase().slice(0,30)||'partida'}
function saveFile(){try{save();const me=G.teams[G.me],fn='comanda-'+(ANF?'anf-':'')+sfSlug(me&&me.n)+'-t'+G.s+'-f'+((G.w|0)+1)+'.json';
  const txt=JSON.stringify({format:SAVEF,version:1,game:SAVEG,saved:new Date().toISOString(),data:G});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  G.msg='💾 '+_t('Partida guardada en el archivo ')+fn+_t('. Para seguirla en otro dispositivo o navegador, abrí el juego ahí y usá «Cargar desde archivo».')}
  catch(e){G.msg='❌ '+_t('No se pudo crear el archivo de la partida.')}render()}
// El archivo viene de afuera: se copia limpiando claves peligrosas y los caracteres que el juego no admite en los textos.
function sfClean(o,d){if(d>64)throw new Error('deep');
  if(Array.isArray(o))return o.map(x=>sfClean(x,d+1));
  if(o&&typeof o==='object'){const r={};Object.keys(o).forEach(k=>{if(k==='__proto__'||k==='constructor'||k==='prototype')return;r[k.replace(/'/g,'’').replace(/[<&"`\\]/g,'')]=sfClean(o[k],d+1)});return r}
  if(typeof o==='string')return o.replace(/'/g,'’').replace(/[<>&"`\\]/g,'');
  if(typeof o==='number')return isFinite(o)?o:0;
  return (typeof o==='boolean'||o===null)?o:null}
function sfCheck(g){const n=x=>Number.isInteger(x);
  return !!(g&&Array.isArray(g.teams)&&g.teams.length>=60&&g.teams.every(t=>t&&typeof t.n==='string'&&Array.isArray(t.sq))
    &&n(g.me)&&g.me>=0&&g.me<g.teams.length&&Array.isArray(g.fx)&&n(g.s)&&n(g.w)
    &&(g.pl==null||(Array.isArray(g.pl)&&g.pl.length>=1&&g.pl.length<=4&&g.pl.every(i=>n(i)&&i>=0&&i<g.teams.length))))}
function sfParse(txt){let d;try{d=JSON.parse(txt)}catch(e){return{err:_t('El archivo no es válido.')}}
  if(!d||d.format!==SAVEF||!d.data||typeof d.data!=='object')return{err:_t('El archivo no es una partida guardada de este juego.')};
  if(d.game&&d.game!==SAVEG)return{err:ANF?_t('Ese archivo es una partida de Comanda el Fútbol, no de Comanda la ANF.'):_t('Ese archivo es una partida de Comanda la ANF, no de Comanda el Fútbol.')};
  let g;try{g=sfClean(d.data,0)}catch(e){g=null}
  if(!sfCheck(g))return{err:_t('La partida del archivo está dañada y no se pudo cargar.')};
  return{g,saved:typeof d.saved==='string'?d.saved:''}}
function loadFile(inp){const f=inp&&inp.files&&inp.files[0];if(inp)inp.value='';if(!f)return;
  if(f.size>50e6){LDP={err:_t('El archivo es demasiado grande.')};render();return}
  const r=new FileReader();r.onload=()=>{LDP=sfParse(String(r.result||''));render()};r.onerror=()=>{LDP={err:_t('El archivo no es válido.')};render()};r.readAsText(f)}
function loadGo(){if(!LDP||!LDP.g)return;const g=LDP.g;LDP=null;let bk=null;try{bk=localStorage.getItem(SK)}catch(e){}
  try{SV=g;askNew=false;askLeave=false;askJoin=false;cont();G.msg='📂 '+_t('Partida cargada desde el archivo.');render()}
  catch(e){try{if(bk)localStorage.setItem(SK,bk);else localStorage.removeItem(SK)}catch(x){}
    SV=loadSave();init();T='home';LDP={err:_t('La partida del archivo está dañada y no se pudo cargar.')};render()}}

const stars=p=>{const n=Math.max(1,Math.min(5,Math.ceil((p-55)/7)));return '★'.repeat(n)+'☆'.repeat(5-n)};
const SEM={1:{cap:8,cost:0,ev:0,pot:0,every:8},2:{cap:10,cost:3.0,ev:.2,pot:.2,every:6},3:{cap:12,cost:5.0,ev:.3,pot:.3,every:4},4:{cap:15,cost:8.0,ev:.4,pot:.4,every:3}};
const semL=t=>(t&&t.sem>=1&&t.sem<=4)?t.sem:1;

function mkY(lvl,nat,ctx){lvl=lvl||1;const y=mkP(pick(['POR','DEF','DEF','MED','MED','DEL','DEL']),40,nat,ctx);y.age=R(15,17);y.r=R(30,45);const rp=()=>58+Math.floor(Math.pow(Math.random(),1.6)*34);y.pot=rp();

const SHOPL=[{n:_t('Sin tienda'),cost:0,up:0,cap:0,m:0},{n:_t('Kiosco del estadio'),cost:1.5,up:.01,cap:25000,m:.5},{n:_t('Tienda oficial'),cost:4,up:.03,cap:80000,m:1},{n:_t('Megatienda'),cost:9,up:.08,cap:200000,m:1.8}];

const QN=[_t('Básica'),_t('Estándar'),_t('Premium')],QM=[1.15,1,.7],LOTS=[2000,10000,40000],nf=n=>Math.round(n).toLocaleString('es-AR'),usd=n=>n>=1e6?'$'+f2(n/1e6)+' M':'$'+nf(n);
function shopOf(t){if(!t.shop)t.shop={lv:0,it:{},tot:{u:0,rev:0,prof:0,up:0}};Object.keys(PRODS).forEach(k=>{if(!t.shop.it[k])t.shop.it[k]={q:1,price:PRODS[k].ref[1],stock:0,last:0,u:0,rev:0}});return t.shop}

function train(){
  const t=G.teams[G.me],iv=t.tr.i&&G.bud>=trc(t);
  // Semillero: cada jornada cada juvenil puede subir 1 punto. La chance depende de la calidad del entrenador
// de juveniles, del nivel del Semillero y de cuánto le falta para su potencial (cerca del techo, avanza más lento).
  const cj=cos(t).JUV,yup=[];if(cj)t.acad.forEach(y=>{const gap=y.pot-y.r;if(gap>0&&Math.random()<Math.min(.85,(cj.q-25)/100*.5*(1+semC(t).ev)*Math.min(1,gap/8)*(SAMC(t)?1.2:1))){y.r++;yup.push(y.n+' ('+y.r+')')}});
  if(iv)G.bud=Math.round((G.bud-trc(t))*100)/100;
  
  if(!t.tr || typeof t.tr.p==='string') t.tr = { p: { POR: null, DEF: null, MED: null, DEL: null }, i: 0 };
  
  const up=[],nc=[];if(!cj&&t.acad.length)nc.push(CPN.JUV);
  POS.forEach(pos => {
    const sel = trSel(t, pos);
    if(sel.length) {
      const c = cos(t)[pos];
      if(!c){nc.push(_t(CPN[pos]));return}
      sel.slice(0, trCap(c.q)).forEach(pName => {
        const p = t.sq.find(x => x.n === pName && x.p === pos);
        if(p && p.r < 92 && Math.random() < Math.min(.9, (c.q-25)/100*.2*(iv ? 2.2 : 1) * agef(p.age) * (SAMC(t)&&p.age<=23?1.2:1))) {
          p.r++;
          up.push(p.n);
        }
      });
    }
  });

  return(iv?_t('Entrenamiento intensivo: −')+f2(trc(t))+' M. ':t.tr.i?_t('Sin fondos para entrenamiento intensivo. '):'')+(nc.length?_t('Sin entrenador de ')+nc.join(', ')+_t(': no se entrenó. '):'')+(up.length?_t('Mejoraron: ')+up.join(', ')+'.':_t('Nadie mejoró esta semana.'))+(yup.length?_t(' 🌱 Juveniles que progresaron: ')+yup.join(', ')+'.':'')
}

        <select id="ofrtype${t.sq.indexOf(p)}${_t("\" style=\"font-size:11px;padding:2px;\">\n          <option value=\"buy\">Compra</option>\n          <option value=\"loan\">Cesión</option>\n        </select>\n        <input id=\"ofr")}${t.sq.indexOf(p)}" type="number" min="0.1" step="0.1" value="${(Math.round((isL?vct(p):val(p))*1.1*10)/10).toFixed(1)}" style="width:4.5em"> 
        <button onclick="offer(${idx},${t.sq.indexOf(p)})" ${p.boughtThisSeason?_t('disabled title="Bloqueado por transferencia reciente"'):''}${_t(">Ofertar</button>\n      </td>")}`:''}</tr>`).join('')+'</table></div>');
    }
  }

  const ok=save();
  A.innerHTML = win(`⚽ ${G.pl.length>1?G.names[G.cur]+' · ':''}${me.n} [${me.country}${_t("] — Temporada ")}${G.s}`, `${ok?'':_t('<p class="m">⚠️ No se pudo guardar la partida en este navegador: si cerrás o recargás la página, se pierde el progreso.</p>')}${msg}${ldUI()}${askLeave?leaveUI():''}${askJoin?joinUI():''}${askNew?_t('<p><b>¿Borrar la partida actual?</b> <button onclick="fresh()">Sí, nueva partida</button> <button onclick="askNew=false;render()">Cancelar</button></p>'):''}`) + navMain + h;
}

function clk(){const d=new Date();document.getElementById('clk').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
clk();setInterval(clk,30000);


// ===== Estadísticas anónimas de uso (Google Sheets + Apps Script) =====
// Envía: inicio de sesión, minutos activos (solo con la pestaña visible) y eventos de la partida.
// No se envía ningún dato personal: el jugador se identifica con un código al azar guardado en este navegador.
const ST_URL='https://script.google.com/macros/s/AKfycbzTLj4YJz2CdNwqheL02p08txZKAWH5DyAnGBBASqsl8V6j_W2Gv2_JDc6st-qu6e3W0A/exec',ST_KEY='cef-2026',ST_VER='4.82';
const stId=()=>'x'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const ST_PID=(()=>{try{let v=localStorage.getItem('cef_pid');if(!v){v=stId();localStorage.setItem('cef_pid',v)}return v}catch(e){return stId()}})(),ST_SID=stId();
function stSend(o){try{const b=JSON.stringify(Object.assign({k:ST_KEY,pid:ST_PID,sid:ST_SID},o));
  fetch(ST_URL,{method:'POST',mode:'no-cors',keepalive:b.length<60000,headers:{'Content-Type':'text/plain;charset=utf-8'},body:b}).catch(()=>{})}catch(e){}}
function stCtx(){try{const t=G&&G.teams&&G.me!=null?G.teams[G.me]:null;
  return{c:t?t.country:'',club:t?t.n:'',div:t?t.div:'',n:G&&G.pl?G.pl.length:'',tw:G&&G.pl?(G.tw===false?'no':'sí'):'',s:G&&G.pl?G.s:'',w:G&&G.pl&&G.fx?Math.min(G.w+1,G.fx.length):'',mode:G&&G.pl&&G.pres&&isPres()?'Presidente':G&&G.pl?'Manager':''}}catch(e){return{}}}
function stEv(ev,det){stSend(Object.assign({t:'ev',ev,det:det||''},stCtx()))}
// Inicio de sesión
stSend({t:'ses',dev:/iPad|Tablet/i.test(navigator.userAgent)||(/Android/i.test(navigator.userAgent)&&!/Mobile/i.test(navigator.userAgent))?'Tablet':/Mobi|Android|iPhone/i.test(navigator.userAgent)?'Celular':'Computadora',scr:screen.width+'x'+screen.height,lang:navigator.language||'',ver:ST_VER});
// Minutos activos: cuenta cada 15 s con la pestaña visible y avisa cada minuto nuevo
let stAct=0,stMin=0;
setInterval(()=>{if(document.visibilityState!=='visible')return;stAct+=15;const m=Math.floor(stAct/60);if(m>stMin){stMin=m;stSend({t:'hb',m})}},15000);
// Errores de JavaScript (hasta 10 distintos por sesión)
const stErrs=new Set();
function stErr(m){m=String(m||'').slice(0,250);if(!m||stErrs.has(m)||stErrs.size>=10)return;stErrs.add(m);stEv('error',m)}
window.addEventListener('error',e=>stErr((e.message||'Error')+(e.lineno?' (línea '+e.lineno+')':'')));
window.addEventListener('unhandledrejection',e=>stErr('Promesa: '+(e.reason&&e.reason.message||e.reason)));
// Eventos de la partida (se envuelven funciones existentes sin cambiar su comportamiento)
(()=>{const o=startGame;startGame=function(){o.apply(this,arguments);if(!SETUP.err&&G&&G.pl&&G.pl.length)stEv('nueva_partida')}})();
(()=>{const o=cont;cont=function(){o.apply(this,arguments);stEv('continuar_partida')}})();
(()=>{const o=newSeason;newSeason=function(){const s0=G.s;o.apply(this,arguments);if(G.s>s0)stEv('fin_temporada','Empieza la temporada '+G.s)}})();
(()=>{const o=presStart;presStart=function(){const was=!!G.pres;o.apply(this,arguments);if(!was&&G.pres)stEv('presidente','Asume como Presidente de '+(G.pres.country||''))}})();
// Secciones visitadas (cada sección se registra una vez por sesión)
const stSec=new Set();
(()=>{const o=render;render=function(){o.apply(this,arguments);try{if(!G||!G.pl||G.me==null)return;
  const a=document.querySelector('.nav-main button.on'),b=document.querySelector('.nav-sub button.on'),
    k=(a?a.textContent.trim():'')+(b?' › '+b.textContent.trim():'');
  if(k&&!stSec.has(k)){stSec.add(k);stEv('seccion',k)}}catch(e){}}})();

// Noticias destacadas: revisar antes de dibujar y mostrar la ventana después
(()=>{const o=render;render=function(){try{alWatch()}catch(e){}o.apply(this,arguments);try{alShow()}catch(e){}try{if(document.getElementById('nmbal'))nmBal()}catch(e){}}})();
(()=>{const o=cont;cont=function(){const r=o.apply(this,arguments);try{if(G&&!G.fb){forBal();save()}}catch(e){}try{if(G&&G.teams&&!G.teams.every(t=>t.rep)){repFill();save()}}catch(e){}return r}})();
init();
SV=loadSave();
try{const L=pnList();if(G&&G.me==null&&L.length){let m='';L.forEach(t=>{m=pnApply(t)});PNM={msg:m,n:L.length}}}catch(e){}
try{if(sessionStorage.getItem('cef_resume')){sessionStorage.removeItem('cef_resume');if(SV){cont();}}}catch(e){}
document.documentElement.lang=LANG;
render();
</script>
