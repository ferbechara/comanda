<style>
:root {
  --bg-dark: #0a0e17;
  --panel-bg: rgba(20, 27, 41, 0.85);
  --panel-border: #1e293b;
  --card-bg: #161f30;
  --primary: #10b981;
  --primary-glow: rgba(16, 185, 129, 0.3);
  --accent: #3b82f6;
  --accent-gold: #f59e0b;
  --fg: #f8fafc;
  --fg-sub: #94a3b8;
  --danger: #ef4444;
  --warning: #f59e0b;
  --success: #10b981;
  --row-even: #121926;
  --me-bg: rgba(245, 158, 11, 0.15);
  --me-border: #f59e0b;
}

*{box-sizing:border-box}
body {
  margin: 0;
  color: var(--fg);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #070a10 linear-gradient(135deg, #070a10 0%, #0f172a 50%, #061121 100%);
  background-attachment: fixed;
  min-height: 100vh;
}

.w { max-width: 860px; margin: 0 auto; padding: 15px 12px 70px; }

.menu-header-img {
  width: 100%;
  height: 100px;
  border-radius: 8px 8px 0 0;
  background-size: cover;
  background-position: center;
  position: relative;
  display: flex;
  align-items: flex-end;
  padding: 12px;
}
.menu-header-img::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(20,27,41,1) 0%, rgba(20,27,41,0.2) 100%);
}
.menu-header-title {
  position: relative;
  z-index: 2;
  font-size: 20px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  display: flex;
  align-items: center;
  gap: 8px;
}

.bg-home { background: radial-gradient(circle, #10b981 0%, #064e3b 100%); }
.bg-tactics { background: linear-gradient(45deg, #0284c7, #0f172a); }
.bg-squad { background: linear-gradient(45deg, #3b82f6, #1e1b4b); }
.bg-cup { background: linear-gradient(45deg, #d97706, #451a03); }
.bg-market { background: linear-gradient(45deg, #8b5cf6, #2e1065); }

.win {
  background: var(--panel-bg);
  backdrop-filter: blur(12px);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  margin-bottom: 16px;
  overflow: hidden;
}

.tb {
  background: rgba(30, 41, 59, 0.8);
  color: var(--fg);
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--panel-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.bd { padding: 14px; overflow-x: auto; }

.lk { color: var(--accent); font-weight: 600; text-decoration: none; cursor: pointer; }
.lk:hover { text-decoration: underline; }

select, input {
  font: inherit;
  color: var(--fg);
  background: var(--card-bg);
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  padding: 6px 10px;
  outline: none;
}
select:focus, input:focus { border-color: var(--primary); }

.nav-main {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
  margin-bottom: 16px;
}

.nav-sub {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--panel-border);
  padding-bottom: 8px;
}

button {
  font: inherit;
  color: var(--fg);
  background: #1e293b;
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  padding: 6px 14px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
button:hover:not(:disabled) {
  background: #334155;
  border-color: var(--fg-sub);
  transform: translateY(-1px);
}
button:active:not(:disabled) { transform: translateY(0); }
button.on {
  background: var(--primary);
  color: #000;
  border-color: var(--primary);
  box-shadow: 0 0 12px var(--primary-glow);
}
button.big {
  font-size: 15px;
  font-weight: 700;
  padding: 10px 20px;
  background: linear-gradient(135deg, var(--primary), #059669);
  color: #000;
  border: none;
  box-shadow: 0 4px 14px var(--primary-glow);
}
button.secondary-big {
  font-size: 15px;
  font-weight: 700;
  padding: 10px 20px;
  background: linear-gradient(135deg, var(--accent), #2563eb);
  color: #fff;
  border: none;
}

.btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 8px; overflow: hidden; }
th, td { padding: 8px 10px; text-align: left; font-size: 13px; }
th { background: #0f172a; color: var(--fg-sub); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
tr:nth-child(even) td { background: var(--row-even); }
tr.me td { background: var(--me-bg) !important; font-weight: 700; color: #fff; }
tr.me { border-left: 3px solid var(--me-border); }

.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #334155;
  vertical-align: middle;
  margin-right: 8px;
  border: 1px solid rgba(255,255,255,0.2);
  display: inline-block;
}

.player-cell { display: flex; align-items: center; }

.sc { overflow-x: auto; }
.m { color: var(--danger); font-weight: 700; }
.sm { font-size: 12px; color: var(--fg-sub); }
.nat { display: inline-block; padding: 2px; border-radius: 4px; border: 1px solid transparent; line-height: 0; }
.nat.ext { border-color: var(--warning); box-shadow: 0 0 0 1px rgba(245,158,11,.35); }

.task {
  position: fixed; left: 0; right: 0; bottom: 0; height: 40px;
  background: #0f172a; border-top: 1px solid var(--panel-border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px; z-index: 100; font-size: 12px;
}

.badge {
  padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase;
}
.badge-por { background: #d97706; color: #fff; }
.badge-def { background: #2563eb; color: #fff; }
.badge-med { background: #059669; color: #fff; }
.badge-del { background: #dc2626; color: #fff; }
.badge-juv { background: #7c3aed; color: #fff; }

.eco-card {
  background: linear-gradient(135deg, rgba(16,185,129,0.1), rgba(15,23,42,0.6));
  border: 1px solid var(--primary);
  border-radius: 8px; padding: 12px; margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.bg-fin { background: linear-gradient(45deg, #f59e0b, #451a03); }
.match-banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:0 0 8px 8px;margin:-4px 0 12px;border:1px solid rgba(255,255,255,.12);color:#fff}
.match-banner .mb-ic{font-size:32px;line-height:1}
.match-banner .mb-t{font-size:18px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.match-banner .mb-d{font-size:13px;opacity:.92;margin-top:2px}
.mb-liga{background:linear-gradient(90deg,#1d4ed8,#1e293b)}
.mb-copa{background:linear-gradient(90deg,#b45309,#451a03)}
.mb-cont{background:linear-gradient(90deg,#047857,#022c22)}
.mb-intc{background:linear-gradient(90deg,#7c3aed,#1e1b4b)}
.mb-sup{background:linear-gradient(90deg,#be123c,#4c0519)}
.mb-libre{background:linear-gradient(90deg,#475569,#1e293b)}
.cal-t tr.maybe td{opacity:.65;font-style:italic}
/* Noticias: tipografía +30% (de 12px a 15,6px) */
.sm.news, .news { font-size: 15.6px; line-height: 1.5; }
.fin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 10px; }
.fin-kpi { background: var(--card-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.fin-kpi b { font-size: 18px; }
.fin-bars { display: flex; align-items: flex-end; gap: 3px; height: 52px; padding: 4px 0; border-bottom: 1px solid var(--panel-border); }
.fin-bar { flex: 1; min-width: 5px; border-radius: 2px 2px 0 0; }
.fin-opt { background: var(--card-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
</style>

function getAvatarSVG(name, pos) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  const skinColors = ['#ffdbac', '#f1c27d', '#e0ac69', '#8d5524', '#c68642'];
  const hairColors = ['#090806', '#2c222b', '#716355', '#b89778', '#a56b46', '#8d4a43'];
  const shirtColors = { POR: '#d97706', DEF: '#2563eb', MED: '#059669', DEL: '#dc2626' };
  
  const skin = skinColors[Math.abs(hash) % skinColors.length];
  const hair = hairColors[Math.abs(hash >> 2) % hairColors.length];
  const shirt = shirtColors[pos] || '#3b82f6';
  
  return `<svg class="avatar" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="50" fill="#1e293b"/>
    <path d="M 30 90 Q 50 75 70 90 L 80 100 L 20 100 Z" fill="${shirt}" />
    <circle cx="50" cy="45" r="22" fill="${skin}" />
    <path d="M 30 40 Q 50 15 70 40 Q 50 30 30 40 Z" fill="${hair}" />
    <circle cx="43" cy="45" r="2.5" fill="#000"/>
    <circle cx="57" cy="45" r="2.5" fill="#000"/>
    <path d="M 44 57 Q 50 62 56 57" stroke="#000" stroke-width="2" fill="none"/>
  </svg>`;
}

// Los traspasos entre clubes (compras, cesiones, ventas y ofertas) solo se hacen mientras la próxima fecha de liga

const trNext=()=>{const f=G.w+1,w=TW.find(([a])=>a>f);return w?w[0]:null};
const trMsg=()=>'🔒 El libro de pases está cerrado: los traspasos entre clubes solo se hacen durante las fechas 1 a 5 y 16 a 20 de la liga'+(trNext()?' (vuelve a abrir en la fecha '+trNext()+')':' (vuelve a abrir al comenzar la próxima temporada)')+'. Los agentes libres (sin contrato con ningún club) se pueden fichar siempre.';

// ===== Contratos de jugadores (sistema simple: solo duración; los sueldos siguen con el cálculo global) =====
// p.ct = temporadas de contrato que le quedan (contando la actual). Al terminar la temporada baja 1; si llega a 0, queda libre.
// p.mh = tiempos jugados en la temporada (cada partido son 2); t.mh = tiempos que jugó su club.
const ctNew=p=>p.age<=23?4:p.age<=27?3:p.age<=31?2:1;            // duración al fichar o comprar
const ctSign=p=>{p.ct=ctNew(p);delete p.xc;delete p.fa;return p};
const ctTxt=p=>p.ct==null?'—':p.ct<=1?'⚠️ último año':p.ct+' temporadas';
// Disposición del jugador a renovar por 'y' temporadas: minutos jugados, si se siente por encima de su club
// (y la chance de que lo quiera uno mejor), su edad y su personalidad.
function rnScore(p,t,y){if(p.rz==null)p.rz=Math.round((Math.random()*.2-.1)*100)/100;
  const pl=(t.mh||0)>=6?Math.min(1,(p.mh||0)/t.mh):.5,gap=p.r-ovr(t),up=gap>0;
  let s=.55+(pl-.5)*.6-Math.max(0,gap)/12*.35-(up?(t.div==3?.25:t.div==2?.15:EUL(t.country)?0:.05)+(SAMC(t)?.08:0):0);
  if(p.age>=30)s+=.06*(y-1);else if(up&&p.age<=26)s-=.07*(y-1);else s+=.02*(y-1);
  return s+p.rz}
const rnLbl=v=>v>=.6?'<b style="color:var(--success)">Alta</b>':v>=.5?'<b style="color:var(--accent-gold)">Media</b>':'<b style="color:var(--danger)">Baja</b>';

  else G.msg='❌ '+p.n+' no acepta renovar por '+y+(y>1?' temporadas':' temporada')+'. Probá con otra duración o dale más minutos.';render()}

// Fin de temporada: vencen los contratos. Los clubes de la IA renuevan a quien les sirve (si el jugador acepta);
// los que se van quedan libres: los del manager siempre llegan al Mercado; de la IA, solo los mejores (el resto se va a otras ligas).
function ctEnd(reps){const pool=[],ai=[];
  G.teams.forEach((t,ti)=>{const hk=G.pl.indexOf(ti),hum=isHum(ti);
    t.sq.slice().forEach(p=>{if(p.ct==null)p.ct=R(1,4);p.ct--;if(p.ct>0)return;
      if(!hum){const want=(p.r>=ovr(t)-4&&p.age<=32)||p.r>=ovr(t)+2,y=ctNew(p);if(want&&rnScore(p,t,y)>=.5){p.ct=y;return}}
      t.sq.splice(t.sq.indexOf(p),1);if(t.lu)t.lu=t.lu.filter(x=>x!==p.n);p.xc=true;p.fa=true;p.disc=.35;p.boughtThisSeason=false;p.originalOwner=null;
      if(hum){pool.push(p);if(hk>=0)reps[hk].push('📄 '+p.n+' ('+p.p+', '+p.r+') terminó su contrato y se fue libre.')}else ai.push(p)})});
  // un manager nunca queda con menos de 14: sube juveniles de la cantera
  G.pl.forEach((ci,k)=>{const t=G.teams[ci];if(!isHum(ci))return;while(t.sq.length<MINSQ){const p=POS.map(q=>[q,AIBASE[q]-t.sq.filter(x=>x.p==q).length]).sort((a,b)=>b[1]-a[1])[0][0],y=mkP(p,52,natOf(t),t.sq.concat(t.acad||[]));y.age=R(17,19);y.r=R(44,58);y.ct=3;t.sq.push(y);reps[k].push('Para completar el plantel subió de la cantera '+y.n+' ('+y.p+', '+y.r+').')}});
  G.teams.forEach(t=>{t.mh=0;t.sq.forEach(p=>{p.mh=0})});
  return pool.concat(ai.sort((a,b)=>b.r-a.r).slice(0,30))}

function aiFill(){G.teams.forEach((t,i)=>{if(isHum(i)||!t.sq)return;const avl=()=>t.sq.filter(x=>!(x.i>0||x.s>0||x.cv>0)).length;while(t.sq.length<AIMIN||(avl()<11&&t.sq.length<MAXSQ)){

  const y=mkP(p,52,natOf(t),t.sq.concat(t.acad||[]));y.age=R(17,19);y.r=R(44,58);y.ct=R(2,3);t.sq.push(y)}})}

function aiTransfers(n){
  const ai=G.teams.map((t,i)=>i).filter(i=>!isHum(i));
  ai.forEach(i=>{if(G.teams[i].bud==null)G.teams[i].bud=R(12,35)});
  
  for(let k=0;k<n;k++){
    const bi=pick(ai),B=G.teams[bi];if(B.sq.length>=MAXSQ)continue;let best=null;
    for(let j=0;j<24;j++){
      const sa=EURC(B)&&Math.random()<.35?ai.filter(i=>SAMC(G.teams[i])):null,si=sa&&sa.length?pick(sa):pick(ai);if(si==bi||(G.bc[bi+'>'+si]||0)>=2)continue;const S=G.teams[si],p=pick(S.sq);if(sellErr(S,p)||S.sq.length<=15)continue;
      if(p.boughtThisSeason) continue;
      if(cupoErr(bi,p))continue;
      if(surCnt(B,sn(p.n))>=2)continue;
      const price=Math.round(vct(p)*(EURC(B)&&SAMC(S)?1.3+Math.random()*.2:1.1)*10)/10;if(price>B.bud)continue;
      const line=B.sq.filter(x=>x.p==p.p).map(x=>x.r).sort((a,b)=>b-a),need=FORM[B.form][POS.indexOf(p.p)],cut=line[need-1]||40;
      if(p.r<=cut+1)continue;if(!best||p.r>best.p.r)best={si,S,p,price}
    }
    if(best){
      const{si,S,p,price}=best;S.sq.splice(S.sq.indexOf(p),1);p.boughtThisSeason=true;ctSign(p);B.sq.push(p);G.bc[bi+'>'+si]=(G.bc[bi+'>'+si]||0)+1;B.bud=Math.round((B.bud-price)*10)/10;S.bud=Math.round(((S.bud||0)+price*.8)*10)/10;presFee(price,B,S);
      tfeed(B.n+' ['+B.country+'] compró a '+p.n+' ('+p.p+' '+p.r+') de '+S.n+' ['+S.country+'] por '+f1(price)+' M')
    }
  }

  G.pl.forEach(humanIdx => {
    const Hs = SAMC(G.teams[humanIdx]), eu = ai.filter(i=>EURC(G.teams[i]));
    if(Math.random() < (Hs ? 0.6 : 0.45)) {
      const buyerIdx = Hs && eu.length && Math.random() < 0.5 ? pick(eu) : pick(ai);
      const prem = Hs && EURC(G.teams[buyerIdx]);
      const B = G.teams[buyerIdx];
      const H = G.teams[humanIdx];
      if(B.sq.length < MAXSQ && H.sq.length > MINSQ) {
        const candidates = H.sq.filter(p => !p.boughtThisSeason && !cupoErr(buyerIdx,p) && !G.offers.some(o => o.from == buyerIdx && o.n == p.n));
        if(candidates.length > 0) {
          const p = pick(candidates);
          const isLoan = Math.random() < (prem ? 0.15 : 0.35);
          if(isLoan) {
            const fee = Math.round(vct(p) * 0.2 * 10) / 10;
            if(B.bud >= fee) {
              G.oid = (G.oid || 0) + 1;
              G.offers.push({ id: G.oid, from: buyerIdx, to: humanIdx, n: p.n, price: fee, type: 'loan' });
              notify(humanIdx, '📨 ' + B.n + ' ['+B.country+'] quiere la CESIÓN de ' + p.n + ' por ' + f1(fee) + ' M.');
            }
          } else {
            const price = Math.round(vct(p) * (prem ? 1.3 + Math.random() * 0.2 : 1.1 + Math.random() * 0.2) * 10) / 10;
            if(B.bud >= price) {
              G.oid = (G.oid || 0) + 1;
              G.offers.push({ id: G.oid, from: buyerIdx, to: humanIdx, n: p.n, price: price, type: 'buy' });
              notify(humanIdx, '📨 ' + B.n + ' ['+B.country+'] ofertó ' + f1(price) + ' M para COMPRAR a ' + p.n + '.');
            }
          }
        }
      }
    }
  });
}

function offer(ci,pi,prOv,tyOv){
  const t=G.teams[ci],p=t.sq[pi],el=document.getElementById('ofr'+pi),typeEl=document.getElementById('ofrtype'+pi),price=prOv!=null?Math.round(prOv*10)/10:Math.round(parseFloat(el&&el.value)*10)/10,type=tyOv||(typeEl?typeEl.value:'buy'),key=G.me+'>'+ci,B=G.teams[G.me];
  const bad=m=>{G.msg=m;render()};
  if(!trOpen())return bad(trMsg());
  if(!(price>0))return bad('Poné un precio válido.');
  if(price>G.bud)return bad('No te alcanza el presupuesto para esa oferta.');
  if(B.sq.length>=MAXSQ)return bad('Tu plantilla está llena (máx. '+MAXSQ+').');
  if((G.bc[key]||0)>=2)return bad('Ya realizaste 2 operaciones con este club esta temporada.');
  if(p.boughtThisSeason) return bad('Este jugador fue transferido o cedido recientemente y no se puede mover de nuevo esta temporada.');
  if(cupoErr(G.me,p))return bad(cupoErr(G.me,p));

  if(!G.pl.includes(ci)){
    const rk=key+'|'+p.n+'|'+type;
    if(G.rej.includes(rk))return bad('Ya rechazaron tu oferta por '+p.n+': probá de nuevo la próxima jornada.');
    const e=sellErr(t,p);if(e)return bad(e);

    const minPrice = type === 'loan' ? vct(p) * 0.18 : vct(p) * 1.05;
    if(price < minPrice * (1 + Math.random() * 0.2)){
      G.rej.push(rk);
      return bad(t.n+' rechazó tu oferta de '+(type==='loan'?'cesión':'compra')+' por '+p.n+'. Esperaban más.');
    }

    t.sq.splice(pi,1);
    p.boughtThisSeason = true;
    if(type === 'loan') {
      p.originalOwner = ci;
    } else ctSign(p);
    B.sq.push(p);
    G.bc[key]=(G.bc[key]||0)+1;
    t.bud=Math.round(((t.bud||0)+price*.8)*10)/10;presFee(price,B,t);
    G.bud=Math.round((G.bud-price)*10)/10;
    tfeed(B.n+' ['+B.country+']'+(type==='loan'?' obtuvo la cesión de ':' compró a ')+p.n+' ('+p.p+' '+p.r+') de '+t.n+' ['+t.country+'] por '+f1(price)+' M');
    return bad('✅ '+t.n+' aceptó: '+p.n+' llegó '+(type==='loan'?'cedido':'en propiedad')+' por '+f1(price)+' M.');
  }

  G.offers=G.offers.filter(o=>!(o.from==G.me&&o.to==ci&&o.n==p.n));G.oid=(G.oid||0)+1;
  G.offers.push({id:G.oid,from:G.me,to:ci,n:p.n,price,type});
  notify(ci,'📨 '+B.n+' ['+B.country+'] ofreció '+(type==='loan'?'CESIÓN':'COMPRA')+' de '+f1(price)+' M por '+p.n+'. Respondé en Mercado.');
  G.msg='Oferta enviada a '+t.n+' por '+p.n+'.';render();
}

function respond(id,acc){
  const i=G.offers.findIndex(o=>o.id==id);if(i<0)return;
  const o=G.offers[i],S=G.teams[o.to],B=G.teams[o.from],pi=S.sq.findIndex(x=>x.n==o.n),p=S.sq[pi];
  const isLoan = o.type === 'loan';

  if(!acc){
    G.offers.splice(i,1);
    if(G.me==o.to && G.pl.includes(o.from)) notify(o.from,'❌ '+S.n+' rechazó tu oferta por '+o.n+'.');
    G.msg='Oferta '+(G.me==o.to?'rechazada':'cancelada')+'.';render();return;
  }

  if(G.me!=o.to)return;
  let err='';
  if(!trOpen())err=trMsg();
  else if(!p)err='El jugador ya no está en el club.';
  else if(p.boughtThisSeason)err='Un jugador transferido/cedido esta temporada no puede volver a cambiar de club.';
  else if(S.sq.length<=14)err='Te quedarías con menos de 14 jugadores.';
  else if(S.sq.filter(x=>x.p==p.p).length<=MIN[p.p])err='Te quedarías sin '+p.p+' suficientes.';
  else if(B.sq.length>=MAXSQ)err='El club comprador tiene la plantilla llena.';
  else if(cupoErr(o.from,p))err='El club comprador no tiene cupo de extranjeros disponible (máx. '+MAXFOR+').';
  else if(B.bud<o.price)err='El comprador ya no tiene presupuesto.';
  else if((G.bc[o.from+'>'+o.to]||0)>=2)err='El comprador ya realizó 2 operaciones con tu club esta temporada.';

  if(err){G.msg=err;render();return}

  S.sq.splice(pi,1);
  if(S.lu)S.lu=S.lu.filter(x=>x!=p.n);
  
  p.boughtThisSeason = true;
  if(isLoan) {
    p.originalOwner = o.to;
  } else ctSign(p);
  
  B.sq.push(p);
  G.bc[o.from+'>'+o.to]=(G.bc[o.from+'>'+o.to]||0)+1;
  S.bud=Math.round((S.bud+o.price)*10)/10;
  B.bud=Math.round((B.bud-o.price)*10)/10;presFee(o.price,B,S);
  G.offers.splice(i,1);

  if(G.pl.includes(o.from)) notify(o.from,'✅ '+S.n+' aceptó tu oferta: '+p.n+' llegó '+(isLoan?'cedido':'en propiedad')+' por '+f1(o.price)+' M.');
  G.msg=(isLoan?'Cediste':'Vendiste')+' a '+p.n+' por '+f1(o.price)+' M.';render();
}

function table(country, d){
  const t=G.teams.map((x,i)=>({i,pj:0,gf:0,gc:0,pts:0}));
  G.res.forEach(w=>w.forEach(([h,a,gh,ga])=>{
    const H=t[h],A=t[a];
    H.pj++;A.pj++;H.gf+=gh;H.gc+=ga;A.gf+=ga;A.gc+=gh;

}

function train(){
  const t=G.teams[G.me],iv=t.tr.i&&G.bud>=trc(t);
  // Semillero: cada jornada cada juvenil puede subir 1 punto. La chance depende de la calidad del entrenador
// de juveniles, del nivel del Semillero y de cuánto le falta para su potencial (cerca del techo, avanza más lento).
  const cj=cos(t).JUV,yup=[];if(cj)t.acad.forEach(y=>{const gap=y.pot-y.r;if(gap>0&&Math.random()<Math.min(.85,(cj.q-25)/100*.5*(1+semC(t).ev)*Math.min(1,gap/8)*(SAMC(t)?1.2:1))){y.r++;yup.push(y.n+' ('+y.r+')')}});
  if(iv)G.bud=Math.round((G.bud-trc(t))*100)/100;
  
  if(!t.tr || typeof t.tr.p==='string') t.tr = { p: { POR: null, DEF: null, MED: null, DEL: null }, i: 0 };
  
  const up=[],nc=[];if(!cj&&t.acad.length)nc.push(CPN.JUV);
  POS.forEach(pos => {
    const sel = trSel(t, pos);
    if(sel.length) {
      const c = cos(t)[pos];
      if(!c){nc.push(CPN[pos]);return}
      sel.slice(0, trCap(c.q)).forEach(pName => {
        const p = t.sq.find(x => x.n === pName && x.p === pos);
        if(p && p.r < 92 && Math.random() < Math.min(.9, (c.q-25)/100*.2*(iv ? 2.2 : 1) * agef(p.age) * (SAMC(t)&&p.age<=23?1.2:1))) {
          p.r++;
          up.push(p.n);
        }
      });
    }
  });

  return(iv?'Entrenamiento intensivo: −'+f2(trc(t))+' M. ':t.tr.i?'Sin fondos para entrenamiento intensivo. ':'')+(nc.length?'Sin entrenador de '+nc.join(', ')+': no se entrenó. ':'')+(up.length?'Mejoraron: '+up.join(', ')+'.':'Nadie mejoró esta semana.')+(yup.length?' 🌱 Juveniles que progresaron: '+yup.join(', ')+'.':'')
}

function setupFirstClub(country,div,k){
  const taken=SETUP.cl.filter((_,j)=>j!==k&&j<SETUP.n);
  return G.teams.findIndex((t,i)=>t.country===country&&t.div===div&&!taken.includes(i))>=0
    ? G.teams.findIndex((t,i)=>t.country===country&&t.div===div&&!taken.includes(i))
    : G.teams.findIndex(t=>t.country===country&&t.div===div);
}
function setupCountry(k,country){
  const old=G.teams[SETUP.cl[k]],div=old&&old.country===country?old.div:1;
  const next=setupFirstClub(country,div,k);
  if(next>=0)SETUP.cl[k]=next;
  render();
}
function setupDivision(k,div){
  const t=G.teams[SETUP.cl[k]],next=setupFirstClub(t.country,+div,k);
  if(next>=0)SETUP.cl[k]=next;
  render();
}
function setupClub(k,club){SETUP.cl[k]=+club;SETUP.err='';render()}

      h += win('Historial de Traspasos','<p class="sm news">Últimos movimientos del mercado internacional.</p>'+(G.tf&&G.tf.length?'<ul style="margin:0;padding-left:18px">'+G.tf.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<p class="sm">Sin transferencias recientes.</p>'));
    } else if(subTab=='coach'){
      h = headerImg + balMk + navSub + coachUI(me);
    } else if(subTab=='scout'){
      h = headerImg + balMk + navSub + scoutUI(me);
    } else {
      const id=VC||'L'+G.me,t=tm(id),isL=id[0]=='L',idx=+id.slice(1),canBuy=isL&&idx!=G.me;
      const og=(l,ids)=>ids.length?`<optgroup label="${l}">`+ids.map(i=>{const q=tm(i);return `<option value="${i}" ${i==id?'selected':''}>${q.n} [${q.country||'INT'}] · nivel ${ovr(q)}</option>`}).join('')+'</optgroup>':'';
      
      h = headerImg + balMk + navSub + win('Buscador de Clubes',`<p>Seleccionar club:</p><select onchange="VC=this.value;render()">${CTRY.map(c=>og(CNM[c]+' - Primera',table(c,1).map(r=>'L'+r.i))+og(CNM[c]+' - Segunda',table(c,2).map(r=>'L'+r.i))).join('')}${og('Copa Internacional (Resto)',G.foreign.map((q,i)=>'F'+i))}${og('Copa Europea (Resto)',(G.foreignE||[]).map((q,i)=>'E'+i))}</select>`)
      +win(t.n+(t.c?' ('+t.c+')':t.country?' ['+t.country+']':''),`<p>Nivel ${ovr(t)} ${isL?' · '+DN[t.div-1]+' ('+t.country+')':''}</p><div class="sc"><table><tr><th>Pos</th><th>Jugador</th><th>Nac.</th><th>Edad</th><th>Nivel</th><th>Goles</th><th>Lesión</th><th>Contrato</th>${canBuy?'<th>Ofertar</th>':''}</tr>`+ord(t.sq).map(p=>`<tr><td><span class="badge badge-${p.p.toLowerCase()}">${PLB(p)}</span></td><td><div class="player-cell">${getAvatarSVG(p.n, p.p)}${p.n}${p.originalOwner!==null&&p.originalOwner!==undefined?' <span style="color:var(--accent-gold);font-size:10px;">[CEDIDO]</span>':''}</div></td><td>${natB(p,t)}</td><td>${p.age}</td><td><b>${p.r}</b></td><td>${isL?((G.sc[idx+'|'+p.n]||{g:0}).g):'-'}</td><td>${p.i>0?'🩹 '+p.i:''}</td><td>${isL?ctTxt(p):'—'}</td>${canBuy?`<td>
        <select id="ofrtype${t.sq.indexOf(p)}" style="font-size:11px;padding:2px;">
          <option value="buy">Compra</option>
          <option value="loan">Cesión</option>
        </select>
        <input id="ofr${t.sq.indexOf(p)}" type="number" min="0.1" step="0.1" value="${(Math.round((isL?vct(p):val(p))*1.1*10)/10).toFixed(1)}" style="width:4.5em"> 
        <button onclick="offer(${idx},${t.sq.indexOf(p)})" ${p.boughtThisSeason?'disabled title="Bloqueado por transferencia reciente"':''}>Ofertar</button>
      </td>`:''}</tr>`).join('')+'</table></div>');
    }
  }

  const ok=save();
  A.innerHTML = win(`⚽ ${G.pl.length>1?G.names[G.cur]+' · ':''}${me.n} [${me.country}] — Temporada ${G.s}`, `${ok?'':'<p class="m">⚠️ No se pudo guardar la partida en este navegador: si cerrás o recargás la página, se pierde el progreso.</p>'}${msg}${askLeave?leaveUI():''}${askJoin?joinUI():''}${askNew?'<p><b>¿Borrar la partida actual?</b> <button onclick="fresh()">Sí, nueva partida</button> <button onclick="askNew=false;render()">Cancelar</button></p>':''}`) + navMain + h;
}

function clk(){const d=new Date();document.getElementById('clk').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
clk();setInterval(clk,30000);


// ===== Estadísticas anónimas de uso (Google Sheets + Apps Script) =====
// Envía: inicio de sesión, minutos activos (solo con la pestaña visible) y eventos de la partida.
// No se envía ningún dato personal: el jugador se identifica con un código al azar guardado en este navegador.
const ST_URL='https://script.google.com/macros/s/AKfycbzTLj4YJz2CdNwqheL02p08txZKAWH5DyAnGBBASqsl8V6j_W2Gv2_JDc6st-qu6e3W0A/exec',ST_KEY='cef-2026',ST_VER='4.82';
const stId=()=>'x'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const ST_PID=(()=>{try{let v=localStorage.getItem('cef_pid');if(!v){v=stId();localStorage.setItem('cef_pid',v)}return v}catch(e){return stId()}})(),ST_SID=stId();
function stSend(o){try{const b=JSON.stringify(Object.assign({k:ST_KEY,pid:ST_PID,sid:ST_SID},o));
  fetch(ST_URL,{method:'POST',mode:'no-cors',keepalive:b.length<60000,headers:{'Content-Type':'text/plain;charset=utf-8'},body:b}).catch(()=>{})}catch(e){}}
function stCtx(){try{const t=G&&G.teams&&G.me!=null?G.teams[G.me]:null;
  return{c:t?t.country:'',club:t?t.n:'',div:t?t.div:'',n:G&&G.pl?G.pl.length:'',tw:G&&G.pl?(G.tw===false?'no':'sí'):'',s:G&&G.pl?G.s:'',w:G&&G.pl&&G.fx?Math.min(G.w+1,G.fx.length):'',mode:G&&G.pl&&G.pres&&isPres()?'Presidente':G&&G.pl?'Manager':''}}catch(e){return{}}}
function stEv(ev,det){stSend(Object.assign({t:'ev',ev,det:det||''},stCtx()))}
// Inicio de sesión
stSend({t:'ses',dev:/iPad|Tablet/i.test(navigator.userAgent)||(/Android/i.test(navigator.userAgent)&&!/Mobile/i.test(navigator.userAgent))?'Tablet':/Mobi|Android|iPhone/i.test(navigator.userAgent)?'Celular':'Computadora',scr:screen.width+'x'+screen.height,lang:navigator.language||'',ver:ST_VER});
// Minutos activos: cuenta cada 15 s con la pestaña visible y avisa cada minuto nuevo
let stAct=0,stMin=0;
setInterval(()=>{if(document.visibilityState!=='visible')return;stAct+=15;const m=Math.floor(stAct/60);if(m>stMin){stMin=m;stSend({t:'hb',m})}},15000);
// Errores de JavaScript (hasta 10 distintos por sesión)
const stErrs=new Set();
function stErr(m){m=String(m||'').slice(0,250);if(!m||stErrs.has(m)||stErrs.size>=10)return;stErrs.add(m);stEv('error',m)}
window.addEventListener('error',e=>stErr((e.message||'Error')+(e.lineno?' (línea '+e.lineno+')':'')));
window.addEventListener('unhandledrejection',e=>stErr('Promesa: '+(e.reason&&e.reason.message||e.reason)));
// Eventos de la partida (se envuelven funciones existentes sin cambiar su comportamiento)
(()=>{const o=startGame;startGame=function(){o.apply(this,arguments);if(!SETUP.err&&G&&G.pl&&G.pl.length)stEv('nueva_partida')}})();
(()=>{const o=cont;cont=function(){o.apply(this,arguments);stEv('continuar_partida')}})();
(()=>{const o=newSeason;newSeason=function(){const s0=G.s;o.apply(this,arguments);if(G.s>s0)stEv('fin_temporada','Empieza la temporada '+G.s)}})();
(()=>{const o=presStart;presStart=function(){const was=!!G.pres;o.apply(this,arguments);if(!was&&G.pres)stEv('presidente','Asume como Presidente de '+(G.pres.country||''))}})();
// Secciones visitadas (cada sección se registra una vez por sesión)
const stSec=new Set();
(()=>{const o=render;render=function(){o.apply(this,arguments);try{if(!G||!G.pl||G.me==null)return;
  const a=document.querySelector('.nav-main button.on'),b=document.querySelector('.nav-sub button.on'),
    k=(a?a.textContent.trim():'')+(b?' › '+b.textContent.trim():'');
  if(k&&!stSec.has(k)){stSec.add(k);stEv('seccion',k)}}catch(e){}}})();

init();
SV=loadSave();
render();
</script>
